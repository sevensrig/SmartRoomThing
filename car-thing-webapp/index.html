<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
<title>Volume Presets</title>
<style>
/* ===========================================================================
 * Car Thing UI — 800x480, DPR 1, Chromium 69 on an Amlogic SoC.
 *
 * Everything here is plain DOM text and CSS. The previous build drew every
 * label as a dot-matrix on <canvas> (hundreds of arc() calls per label, plus a
 * requestAnimationFrame EQ doing ~1700 per frame), which is what made the UI
 * expensive on this hardware. Text is now laid out by the browser once and only
 * touched when its content actually changes.
 *
 * Chromium 69 constraints: no aspect-ratio, no backdrop-filter, and no flexbox
 * gap (that landed in 84) — spacing uses margins throughout.
 * =========================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-top:      #1b2836;
  --bg-bottom:   #0e141b;
  --card:        #16202c;
  --text:        #f2f5f8;
  --text-dim:    #9aa8b6;
  --text-faint:  #5d6b7a;
  --accent:      #e8edf2;
  --track:       #38434f;
  --fader:       #4a90d9;
  --fader-focus: #7cb8ff;
}

html, body {
  width: 800px; height: 480px;
  overflow: hidden;
  background: #000;
  /* Circular is Spotify's own face and ships on the Car Thing image; Noto Sans
     is the only other real sans installed (everything else falls back to the
     same default). */
  font-family: "Circular Sp UI v3 T", "Noto Sans", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: none;
}

#app {
  width: 800px; height: 480px;
  background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  position: relative;
}

/* ---------- shared chrome ---------- */
.topbar {
  height: 56px;
  display: flex; align-items: center;
  padding: 0 26px;
}
.topbar .tb-side { width: 44px; font-size: 22px; color: var(--text-dim); }
.topbar .tb-side.right { text-align: right; }
.topbar .tb-title {
  flex: 1; text-align: center;
  font-size: 17px; font-weight: bold;
  letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--text-dim);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

.view { display: none; width: 800px; height: 480px; flex-direction: column; }
.view.active { display: flex; }

/* ---------- now playing ---------- */
#np-body { flex: 1; display: flex; align-items: center; padding: 0 34px; }

#np-art {
  width: 268px; height: 268px; flex: none;
  border-radius: 14px;
  background: linear-gradient(150deg, #2f4a63, #1d2c3b);
  background-size: cover; background-position: center;
  margin-right: 34px;
  overflow: hidden;
}

#np-info { flex: 1; min-width: 0; }

#np-title {
  font-size: 40px; font-weight: bold; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#np-artist {
  font-size: 23px; color: var(--text-dim);
  margin-top: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#np-progress {
  height: 6px; border-radius: 3px;
  background: var(--track);
  margin-top: 30px;
  overflow: hidden;
}
#np-progress-fill {
  height: 100%; width: 0%;
  background: var(--accent);
  border-radius: 3px;
}
#np-times {
  display: flex; justify-content: space-between;
  font-size: 15px; color: var(--text-dim);
  margin-top: 9px;
}

#np-controls { display: flex; align-items: center; margin-top: 26px; }
.ctl {
  width: 74px; height: 58px;
  display: flex; align-items: center; justify-content: center;
  margin-right: 26px;
}
.ctl svg { fill: var(--text); }
.ctl:active svg { fill: var(--text-dim); }

/* ---------- mixer ---------- */
#save-btn {
  position: absolute; top: 14px; right: 22px;
  padding: 8px 16px; border-radius: 16px;
  border: 1px solid var(--text-faint);
  font-size: 14px; letter-spacing: 1.2px; color: var(--text-dim);
  z-index: 5;
}
#save-btn.armed { border-color: var(--fader-focus); color: var(--fader-focus); }

#faders { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 6px 40px 42px; }
.fader { width: 150px; margin: 0 22px; text-align: center; }
.fader-pct { font-size: 30px; font-weight: bold; margin-bottom: 12px; }
.fader-track {
  height: 232px; border-radius: 10px;
  background: var(--track);
  position: relative; overflow: hidden;
}
.fader-fill {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--fader);
  border-radius: 10px;
}
.fader.focus .fader-fill { background: var(--fader-focus); }
.fader-name {
  font-size: 15px; letter-spacing: 1.6px; color: var(--text-dim);
  margin-top: 12px;
}
.fader.dead { opacity: 0.34; }

/* ---------- playlists ---------- */
#pl-list { flex: 1; padding: 2px 34px; overflow: hidden; }
.pl-row {
  height: 56px; line-height: 56px;
  padding: 0 18px; border-radius: 10px;
  font-size: 22px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-row.sel { background: rgba(255,255,255,0.10); color: var(--text); font-weight: bold; }
#pl-hint {
  height: 44px; line-height: 44px; text-align: center;
  font-size: 14px; letter-spacing: 1.2px; color: var(--text-faint);
}

/* ---------- message ---------- */
#message {
  display: none;
  position: absolute; top: 0; left: 0;
  width: 800px; height: 480px;
  align-items: center; justify-content: center;
  padding: 0 70px; text-align: center;
  background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
  font-size: 24px; color: var(--text-dim); line-height: 1.5;
  z-index: 10;
}

/* Transient centre overlay (playlist PLAYING / ERROR, saved-preset flash). */
#toast {
  display: none;
  position: absolute; top: 50%; left: 50%;
  -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
  padding: 18px 34px; border-radius: 14px;
  background: rgba(0,0,0,0.72);
  font-size: 26px; font-weight: bold; letter-spacing: 1.5px;
  z-index: 20;
}
#toast.show { display: block; }

#dbg {
  position: fixed; left: 6px; bottom: 4px; z-index: 999;
  color: #0f0; opacity: 0.85; font-size: 13px;
  font-family: monospace; pointer-events: none;
  max-width: 788px; white-space: pre-wrap; word-break: break-all;
}
</style>
</head>
<body>
<div id="app">

  <!-- Now Playing (home screen) -->
  <div class="view" id="now-playing-view">
    <div class="topbar">
      <div class="tb-side">&#9662;</div>
      <div class="tb-title" id="np-context">Now Playing</div>
      <div class="tb-side right">&#8943;</div>
    </div>
    <div id="np-body">
      <div id="np-art"></div>
      <div id="np-info">
        <div id="np-title">Nothing playing</div>
        <div id="np-artist"></div>
        <div id="np-progress"><div id="np-progress-fill"></div></div>
        <div id="np-times"><span id="np-elapsed">0:00</span><span id="np-remain">-0:00</span></div>
        <div id="np-controls">
          <div class="ctl" id="btn-prev">
            <svg width="34" height="34" viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
          </div>
          <div class="ctl" id="btn-playpause">
            <svg width="40" height="40" viewBox="0 0 24 24" id="pp-icon"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
          </div>
          <div class="ctl" id="btn-next">
            <svg width="34" height="34" viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mixer -->
  <div class="view" id="mixer-view">
    <div id="save-btn">SAVE</div>
    <div class="topbar"><div class="tb-side"></div><div class="tb-title" id="mix-header">Volume</div><div class="tb-side right"></div></div>
    <div id="faders"></div>
  </div>

  <!-- Playlists -->
  <div class="view" id="playlists-view">
    <div class="topbar"><div class="tb-side">&#9662;</div><div class="tb-title">Playlists</div><div class="tb-side right"></div></div>
    <div id="pl-list"></div>
    <div id="pl-hint">DIAL SCROLL &nbsp;·&nbsp; 1 PLAY &nbsp;·&nbsp; 2 REFRESH &nbsp;·&nbsp; BACK EXIT</div>
  </div>

  <div id="toast"></div>
  <div id="message"><div id="message-text"></div></div>
  <div id="dbg"></div>

</div>

<script>
/* =========================================================
 *  CONFIG
 * ========================================================= */
const SERVER = 'http://localhost:5005';
const SPOTIFY_POLL_MS = 5000;
const STATUS_POLL_MS = 4000;

// Set true to print the last key / hardware-websocket event bottom-left; used to
// identify the Car Thing's back button.
const DEBUG_INPUT = false;
function dbg(label, data) {
  if (!DEBUG_INPUT) return;
  const el = document.getElementById('dbg');
  if (el) el.textContent = label + ': ' + data;
}

// No Spotify credentials reach this webapp. server.py holds the client id,
// secret and refresh token in presets.json and proxies every Spotify call.

/* =========================================================
 *  STATE
 * ========================================================= */
const STATE = {
  config: null,           // /presets payload
  activePreset: null,
  view: 'np',             // 'mixer' | 'np' | 'playlists' — Now Playing is home
  volumes: {},            // live per-speaker volumes (0..1)
  unavailable: {},        // speaker key -> reason the server can't drive it
  focus: null,            // speaker key the dial controls, or null = ALL
  spotify: {
    track: null, artist: null, album: null, artUrl: null, playing: false,
    progressMs: 0, durationMs: 0, at: 0,   // for the local progress ticker
  },
};

const SPEAKER_ORDER = ['nest_audio', 'google_home', 'chromecast'];
const SPEAKER_LABELS = { nest_audio: 'NEST', google_home: 'HOME', chromecast: 'CAST' };
const VOL_STEP = 0.05;      // per dial detent / arrow key
const NP_RETURN_MS = 12000; // idle delay before the mixer reverts to Now Playing
const SAVE_ARM_MS = 6000;   // how long "save" stays armed waiting for a preset

let focusTimer = null;
let npReturnTimer = null;
let mixerBuilt = false;
let saveArmed = false;
let saveArmTimer = null;

/* Only touch the DOM when a value actually changed — on this SoC a redundant
   textContent write still costs a style recalc. */
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }

let toastTimer = null;
function showToast(text, ms) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() {
  document.getElementById('toast').classList.remove('show');
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
}

function scheduleReturnToNowPlaying() {
  if (npReturnTimer) clearTimeout(npReturnTimer);
  npReturnTimer = setTimeout(() => {
    npReturnTimer = null;
    if (STATE.view === 'mixer') { STATE.view = 'np'; applyView(); }
  }, NP_RETURN_MS);
}
function cancelReturnToNowPlaying() {
  if (npReturnTimer) { clearTimeout(npReturnTimer); npReturnTimer = null; }
}

/* =========================================================
 *  SERVER
 * ========================================================= */
async function fetchConfig() {
  // Throws on failure so init() can retry — at boot the USB tunnel may not be
  // up yet, and "server unreachable" must not be read as "not configured".
  const r = await fetch(SERVER + '/presets', { cache: 'no-store' });
  if (!r.ok) throw new Error('presets HTTP ' + r.status);
  STATE.config = await r.json();
}

async function fetchStatus() {
  try {
    const r = await fetch(SERVER + '/status', { cache: 'no-store' });
    const j = await r.json();
    STATE.activePreset = j.active_preset;
    if (j.volumes) STATE.volumes = j.volumes;
    STATE.unavailable = j.unavailable || {};
  } catch (e) {}
}

/* =========================================================
 *  VIEWS
 * ========================================================= */
function applyView() {
  const v = STATE.view;
  document.getElementById('now-playing-view').classList.toggle('active', v === 'np');
  document.getElementById('mixer-view').classList.toggle('active', v === 'mixer');
  document.getElementById('playlists-view').classList.toggle('active', v === 'playlists');
  document.getElementById('message').style.display = 'none';
  if (v === 'mixer') renderMixer();
  else if (v === 'np') renderNowPlaying();
  else renderPlaylists();
}

function toggleView() {
  STATE.view = (STATE.view === 'mixer') ? 'np' : 'mixer';
  applyView();
  if (STATE.view === 'mixer') scheduleReturnToNowPlaying();
  else cancelReturnToNowPlaying();
}

/* =========================================================
 *  MIXER
 * ========================================================= */
function buildFaders() {
  if (mixerBuilt) return;
  const wrap = document.getElementById('faders');
  wrap.innerHTML = '';
  SPEAKER_ORDER.forEach((sp) => {
    const f = document.createElement('div');
    f.className = 'fader';
    f.dataset.sp = sp;
    f.innerHTML =
      '<div class="fader-pct"></div>' +
      '<div class="fader-track"><div class="fader-fill"></div></div>' +
      '<div class="fader-name"></div>';
    f.addEventListener('click', () => focusDevice(sp));
    wrap.appendChild(f);
  });
  mixerBuilt = true;
}

function renderMixer() {
  buildFaders();
  let title = 'Volume';
  if (saveArmed) title = 'Save to 1 / 2 / 3';
  else if (STATE.focus) title = SPEAKER_LABELS[STATE.focus] || STATE.focus;
  else if (STATE.activePreset && STATE.config && STATE.config.presets) {
    const p = STATE.config.presets[STATE.activePreset];
    if (p && p.name) title = p.name;
  }
  setText(document.getElementById('mix-header'), title);
  document.getElementById('save-btn').classList.toggle('armed', saveArmed);

  const faders = document.querySelectorAll('#faders .fader');
  for (let i = 0; i < faders.length; i++) {
    const f = faders[i];
    const sp = f.dataset.sp;
    const v = Math.max(0, Math.min(1, STATE.volumes[sp] || 0));
    // The server reports speakers it can't drive (offline, or a TV that isn't
    // casting). Dim those so the dial visibly does nothing on them, rather than
    // looking live while every turn is discarded.
    const dead = !!STATE.unavailable[sp];
    f.classList.toggle('dead', dead);
    f.classList.toggle('focus', STATE.focus === sp && !dead);
    f.querySelector('.fader-fill').style.height = (v * 100) + '%';
    setText(f.querySelector('.fader-pct'), dead ? '--' : String(Math.round(v * 100)));
    setText(f.querySelector('.fader-name'), SPEAKER_LABELS[sp] || sp);
  }
}

function focusDevice(sp) {
  STATE.focus = sp;
  armFocusTimeout();
  scheduleReturnToNowPlaying();
  renderMixer();
}

function armFocusTimeout() {
  if (focusTimer) clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { STATE.focus = null; renderMixer(); }, 4000);
}

async function activatePreset(id) {
  try {
    const r = await fetch(SERVER + '/preset/' + id, { method: 'POST' });
    const j = await r.json();
    if (j && j.volumes) STATE.volumes = j.volumes;
    STATE.activePreset = id;
  } catch (e) { console.error('preset error', e); }
  if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
  else renderMixer();
  scheduleReturnToNowPlaying();
}

function armSave() {
  saveArmed = !saveArmed;
  if (saveArmTimer) clearTimeout(saveArmTimer);
  if (saveArmed) saveArmTimer = setTimeout(() => { saveArmed = false; renderMixer(); }, SAVE_ARM_MS);
  scheduleReturnToNowPlaying();
  renderMixer();
}

async function savePreset(id) {
  saveArmed = false;
  if (saveArmTimer) { clearTimeout(saveArmTimer); saveArmTimer = null; }
  try {
    const r = await fetch(SERVER + '/preset/' + id + '/save', { method: 'POST' });
    const j = await r.json();
    if (j && j.ok) {
      if (STATE.config && STATE.config.presets && STATE.config.presets[id] && j.levels) {
        Object.assign(STATE.config.presets[id], j.levels);
      }
      showToast('SAVED  ' + ((j.preset || '').toUpperCase() || id), 1800);
      STATE.activePreset = id;
    }
  } catch (e) { console.error('save preset error', e); }
  scheduleReturnToNowPlaying();
  renderMixer();
}

/* =========================================================
 *  VOLUME
 * ========================================================= */
// One request in flight at a time. The dial can emit detents faster than a
// round trip completes; without this they queue and keep landing after you stop
// turning, so the volume appears to drift on its own. Extra turns accumulate
// here and go out as a single combined delta on the next request.
let volInFlight = false;
let volPending = 0;

async function adjustVolume(delta) {
  // Turning the dial shows the mixer so you can see it move; it reverts to Now
  // Playing after a short idle.
  if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
  scheduleReturnToNowPlaying();
  if (STATE.focus) armFocusTimeout();

  // A focused fader the server can't drive would swallow every turn silently.
  if (STATE.focus && STATE.unavailable[STATE.focus]) { renderMixer(); return; }

  volPending += delta;
  if (volInFlight) return;
  volInFlight = true;
  try {
    while (volPending !== 0) {
      const d = volPending;
      volPending = 0;
      const body = { delta: d };
      if (STATE.focus) body.speaker = STATE.focus;
      const r = await fetch(SERVER + '/volume/adjust', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (j && j.volumes) STATE.volumes = j.volumes;
      if (j && j.unavailable) STATE.unavailable = j.unavailable;
      renderMixer();
    }
  } catch (e) {
    console.error('volume adjust error', e);
  } finally {
    volInFlight = false;
  }
}

/* =========================================================
 *  NOW PLAYING
 * ========================================================= */
async function pollSpotify() {
  try {
    const r = await fetch(SERVER + '/spotify/now-playing', { cache: 'no-store' });
    if (!r.ok) return;
    handleNowPlaying(await r.json());
  } catch (e) { console.error('spotify poll error', e); }
}

async function spotifyControl(action) {
  try { await fetch(SERVER + '/spotify/' + action, { method: 'POST' }); }
  catch (e) { console.error('spotify control error', e); }
  setTimeout(pollSpotify, 350);
  setTimeout(pollSpotify, 1200);
}

function handleNowPlaying(j) {
  const s = STATE.spotify;
  if (!j || !j.item) {
    s.playing = false;
    s.track = null; s.artist = null; s.album = null; s.artUrl = null;
    s.progressMs = 0; s.durationMs = 0; s.at = Date.now();
  } else {
    s.playing = !!j.is_playing;
    s.track = j.item.name || '';
    s.artist = (j.item.artists || []).map(a => a.name).join(', ');
    s.album = (j.item.album && j.item.album.name) || '';
    s.progressMs = j.progress_ms || 0;
    s.durationMs = j.item.duration_ms || 0;
    s.at = Date.now();
    const imgs = (j.item.album && j.item.album.images) || [];
    // Album art lives on the Spotify CDN, which the device can't reach — the
    // server proxies it.
    s.artUrl = imgs.length ? (SERVER + '/spotify/art?u=' + encodeURIComponent(imgs[0].url)) : null;
  }
  if (STATE.view === 'np') renderNowPlaying();
}

function fmtTime(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const sec = total % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* Elapsed position, extrapolated between polls so the bar moves smoothly
   without polling the server every second. */
function currentProgressMs() {
  const s = STATE.spotify;
  let ms = s.progressMs;
  if (s.playing) ms += (Date.now() - s.at);
  if (s.durationMs) ms = Math.min(ms, s.durationMs);
  return ms;
}

// Falling back to 'none' would also clear the CSS placeholder gradient, leaving
// an invisible square for tracks with no artwork.
const ART_PLACEHOLDER = 'linear-gradient(150deg, #2f4a63, #1d2c3b)';
let lastArtUrl = null;
function renderNowPlaying() {
  const s = STATE.spotify;
  setText(document.getElementById('np-title'), s.track || 'Nothing playing');
  setText(document.getElementById('np-artist'), s.artist || '');
  setText(document.getElementById('np-context'), s.album || 'Now Playing');

  // Only reassign the background when the URL changes — otherwise every poll
  // re-hits the server's art proxy.
  if (s.artUrl !== lastArtUrl) {
    lastArtUrl = s.artUrl;
    document.getElementById('np-art').style.backgroundImage =
      s.artUrl ? ('url("' + s.artUrl + '")') : ART_PLACEHOLDER;
  }

  // Play/pause glyph: two bars when playing, triangle when paused.
  const icon = document.getElementById('pp-icon');
  const want = s.playing ? 'M7 4h4v16H7zM13 4h4v16h-4z' : 'M7 4l13 8-13 8z';
  const path = icon.firstElementChild || icon.querySelector('path');
  if (path && path.getAttribute('d') !== want) path.setAttribute('d', want);

  renderProgress();
}

function renderProgress() {
  const s = STATE.spotify;
  const ms = currentProgressMs();
  const pct = s.durationMs ? Math.max(0, Math.min(100, (ms / s.durationMs) * 100)) : 0;
  const fill = document.getElementById('np-progress-fill');
  const w = pct.toFixed(1) + '%';
  if (fill.style.width !== w) fill.style.width = w;
  setText(document.getElementById('np-elapsed'), fmtTime(ms));
  setText(document.getElementById('np-remain'), s.durationMs ? '-' + fmtTime(s.durationMs - ms) : '-0:00');
}

/* =========================================================
 *  PLAYLISTS
 *  Back button opens it; dial scrolls, 1 plays, 2 refreshes.
 * ========================================================= */
const PL_VISIBLE_ROWS = 6;
const playlistState = {
  items: [], selected: 0, scrollTop: 0,
  loading: false, loaded: false, error: false,
};
let plRowsBuilt = false;
let playlistFlashTimer = null;

function openPlaylists() {
  cancelReturnToNowPlaying();
  STATE.view = 'playlists';
  applyView();
  loadPlaylists(false);
}

/* Back button: Playlists -> Mixer, or Mixer/NowPlaying -> Playlists. */
function handleBack() {
  if (STATE.view === 'playlists') {
    STATE.view = 'mixer';
    applyView();
    scheduleReturnToNowPlaying();
  } else {
    openPlaylists();
  }
}

async function loadPlaylists(force) {
  if (playlistState.loading) return;
  if (playlistState.loaded && !force) { renderPlaylists(); return; }
  playlistState.loading = true;
  playlistState.error = false;
  if (STATE.view === 'playlists') renderPlaylists();
  try {
    const r = await fetch(SERVER + '/spotify/playlists', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    playlistState.items = Array.isArray(arr) ? arr : [];
    playlistState.selected = 0;
    playlistState.scrollTop = 0;
    playlistState.loaded = true;
  } catch (e) {
    console.error('playlists fetch error', e);
    playlistState.error = true;
  } finally {
    playlistState.loading = false;
    if (STATE.view === 'playlists') renderPlaylists();
  }
}

function movePlaylistSelection(dir) {
  const n = playlistState.items.length;
  if (!n) return;
  playlistState.selected = Math.max(0, Math.min(n - 1, playlistState.selected + dir));
  if (playlistState.selected < playlistState.scrollTop) {
    playlistState.scrollTop = playlistState.selected;
  } else if (playlistState.selected >= playlistState.scrollTop + PL_VISIBLE_ROWS) {
    playlistState.scrollTop = playlistState.selected - PL_VISIBLE_ROWS + 1;
  }
  renderPlaylists();
}

async function playSelectedPlaylist() {
  const it = playlistState.items[playlistState.selected];
  if (!it || !it.id) return;
  showToast('PLAYING');
  let ok = false;
  try {
    // device_name omitted on purpose — the server uses spotify_connect_device
    // from presets.json, which never reaches the device.
    const r = await fetch(SERVER + '/spotify/play-playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playlist_uri: it.id }),
    });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && j && j.ok === true;
  } catch (e) {
    console.error('play-playlist error', e);
  }
  if (playlistFlashTimer) clearTimeout(playlistFlashTimer);
  if (ok) {
    playlistFlashTimer = setTimeout(() => {
      hideToast();
      STATE.view = 'mixer';
      applyView();
      scheduleReturnToNowPlaying();
      pollSpotify();
    }, 2000);
  } else {
    showToast('ERROR', 2000);
  }
}

function buildPlaylistRows() {
  if (plRowsBuilt) return;
  const list = document.getElementById('pl-list');
  list.innerHTML = '';
  for (let i = 0; i < PL_VISIBLE_ROWS; i++) {
    const row = document.createElement('div');
    row.className = 'pl-row';
    row.addEventListener('click', (function (slot) {
      return function () {
        const idx = playlistState.scrollTop + slot;
        if (idx < playlistState.items.length) {
          playlistState.selected = idx;
          renderPlaylists();
        }
      };
    })(i));
    list.appendChild(row);
  }
  plRowsBuilt = true;
}

function renderPlaylists() {
  buildPlaylistRows();
  const rows = document.querySelectorAll('#pl-list .pl-row');
  const st = playlistState;
  let placeholder = null;
  if (st.loading && !st.items.length) placeholder = 'Loading…';
  else if (st.error) placeholder = 'Could not load playlists';
  else if (!st.items.length) placeholder = 'No playlists';

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (placeholder !== null) {
      setText(row, i === 0 ? placeholder : '');
      row.classList.remove('sel');
      continue;
    }
    const idx = st.scrollTop + i;
    const it = st.items[idx];
    setText(row, it ? (it.name || '') : '');
    row.classList.toggle('sel', !!it && idx === st.selected);
  }
}

/* =========================================================
 *  INPUT
 * ========================================================= */
function handleScroll(dir) {
  if (STATE.view === 'playlists') movePlaylistSelection(dir > 0 ? +1 : -1);
  else adjustVolume(dir > 0 ? +VOL_STEP : -VOL_STEP);
}

function bindKeyboard() {
  window.addEventListener('keydown', (e) => {
    dbg('key', e.key + ' / code=' + e.code);
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      handleBack();
      return;
    }
    if (STATE.view === 'playlists') {
      if (e.key === '1')              playSelectedPlaylist();
      else if (e.key === '2')         loadPlaylists(true);
      else if (e.key === 'ArrowUp')   movePlaylistSelection(-1);
      else if (e.key === 'ArrowDown') movePlaylistSelection(+1);
      return;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      if (saveArmed) savePreset(e.key);
      else activatePreset(e.key);
    }
    else if (e.key === '4') { toggleView(); }
    else if (e.key === 'ArrowUp')   { adjustVolume(+VOL_STEP); }
    else if (e.key === 'ArrowDown') { adjustVolume(-VOL_STEP); }
  });

  // The rotary dial is a relative wheel encoder (REL_HWHEEL) with no keyboard
  // handler, so the webview delivers it as a DOM `wheel` event — one detent per
  // event (measured: a single detent produces exactly one event, deltaX 53).
  window.addEventListener('wheel', (e) => {
    const d = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (d > 0) handleScroll(+1);
    else if (d < 0) handleScroll(-1);
  }, { passive: true });

  document.getElementById('save-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    armSave();
  });

  // Tapping the mixer away from a fader deselects, so the dial goes back to
  // controlling all speakers together.
  document.getElementById('mixer-view').addEventListener('click', (e) => {
    if (e.target.closest('.fader') || e.target.closest('#save-btn')) return;
    if (STATE.focus) {
      STATE.focus = null;
      if (focusTimer) clearTimeout(focusTimer);
      renderMixer();
    }
    scheduleReturnToNowPlaying();
  });

  document.getElementById('btn-prev').addEventListener('click', () => spotifyControl('previous'));
  document.getElementById('btn-next').addEventListener('click', () => spotifyControl('next'));
  document.getElementById('btn-playpause').addEventListener('click', () => {
    const s = STATE.spotify;
    const action = s.playing ? 'pause' : 'play';
    // Optimistic: flip locally and re-anchor the ticker so the bar doesn't jump.
    s.progressMs = currentProgressMs();
    s.at = Date.now();
    s.playing = !s.playing;
    renderNowPlaying();
    spotifyControl(action);
  });
}

function connectHardwareWS() {
  let ws;
  try { ws = new WebSocket('ws://localhost:8890'); }
  catch (e) { return; }
  ws.onopen = () => console.log('hw ws open');
  ws.onclose = () => setTimeout(connectHardwareWS, 3000);
  ws.onerror = () => {};
  ws.onmessage = (evt) => {
    dbg('ws', evt.data);
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    // Shapes seen: {type:'button', button:1..5, action:'down'} and
    // {type:'dial'|'wheel', delta:+1|-1}. The back button arrives as its own
    // {type:'back'} or as button id 5 (id still unconfirmed on this unit).
    if (msg.type === 'back') { handleBack(); return; }
    if (msg.type === 'button' && (msg.action === 'down' || msg.action === 'short' || !msg.action)) {
      const b = String(msg.button);
      if (b === '5') { handleBack(); return; }
      if (STATE.view === 'playlists') {
        if (b === '1') playSelectedPlaylist();
        else if (b === '2') loadPlaylists(true);
        return;
      }
      if (b === '1' || b === '2' || b === '3') activatePreset(b);
      else if (b === '4') toggleView();
    } else if (msg.type === 'dial' || msg.type === 'wheel') {
      const delta = Number(msg.delta) || 0;
      if (delta > 0) handleScroll(+1);
      else if (delta < 0) handleScroll(-1);
    }
  };
}

/* =========================================================
 *  MESSAGE / START
 * ========================================================= */
function showMessage(text) {
  document.getElementById('now-playing-view').classList.remove('active');
  document.getElementById('mixer-view').classList.remove('active');
  document.getElementById('playlists-view').classList.remove('active');
  const msg = document.getElementById('message');
  msg.style.display = 'flex';
  setText(document.getElementById('message-text'), text);
}

async function startPlayer() {
  await fetchStatus();
  applyView();
  bindKeyboard();
  connectHardwareWS();

  setInterval(async () => {
    await fetchStatus();
    if (STATE.view === 'mixer') renderMixer();
  }, STATUS_POLL_MS);

  pollSpotify();
  setInterval(pollSpotify, SPOTIFY_POLL_MS);

  // Local progress ticker — one cheap DOM update a second instead of polling
  // the server, and only while Now Playing is on screen.
  setInterval(() => {
    if (STATE.view === 'np' && STATE.spotify.durationMs) renderProgress();
  }, 1000);
}

async function init() {
  // The Car Thing reaches the Pi over a USB (adb reverse) tunnel that may not be
  // up the instant this page loads at boot. Retry until the server answers, so a
  // transient failure is never mistaken for "not set up".
  while (true) {
    try { await fetchConfig(); break; }
    catch (e) {
      showMessage('Connecting to server…');
      await new Promise(res => setTimeout(res, 2000));
    }
  }
  if (!STATE.config.spotify_configured) {
    showMessage('Open http://127.0.0.1:5005/auth on your computer to finish Spotify setup.');
    return;
  }
  startPlayer();
}

init();
</script>
</body>
</html>
