<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
<title>Volume Presets</title>
<style>
/* ===========================================================================
 * Car Thing UI — 800x480, DPR 1, Chromium 69 on an Amlogic SoC.
 *
 * Everything here is plain DOM text and CSS. The previous build drew every
 * label as a dot-matrix on <canvas> (hundreds of arc() calls per label, plus a
 * requestAnimationFrame EQ doing ~1700 per frame), which is what made the UI
 * expensive on this hardware. Text is now laid out by the browser once and only
 * touched when its content actually changes.
 *
 * Chromium 69 constraints: no aspect-ratio, no backdrop-filter, and no flexbox
 * gap (that landed in 84) — spacing uses margins throughout.
 * =========================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

/* Hand-lettered face for the idle clock, in the spirit of Schulz's lettering.
   Bundled because the Car Thing has no internet. Schoolbell, Apache License
   2.0 (see fonts/README.md). */
@font-face {
  font-family: "Schoolbell";
  src: url("fonts/Schoolbell.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}

:root {
  --bg-top:      #1b2836;
  --bg-bottom:   #0e141b;
  --card:        #16202c;
  --text:        #f2f5f8;
  --text-dim:    #9aa8b6;
  --text-faint:  #5d6b7a;
  --accent:      #e8edf2;
  --track:       #38434f;
  --fader:       #4a90d9;
  --fader-focus: #7cb8ff;
}

html, body {
  width: 800px; height: 480px;
  overflow: hidden;
  background: #000;
  /* Circular is Spotify's own face and ships on the Car Thing image; Noto Sans
     is the only other real sans installed (everything else falls back to the
     same default). */
  font-family: "Circular Sp UI v3 T", "Noto Sans", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: none;
}

#app {
  width: 800px; height: 480px;
  background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  position: relative;
}

/* ---------- physical button legend ----------
 * The 1/2/3/4 buttons sit in the bezel directly above the screen, spread evenly
 * across its width. This strip puts a tick under each one at its real x
 * position, with that button's current action beneath — so the labels line up
 * with the hardware rather than just listing what the buttons do.
 * Span matches the buttons: 1 starts at the left edge, 4 ends at the right. */
#btnbar {
  position: absolute; top: 0; left: 0;
  width: 800px; height: 40px;
  display: flex; align-items: flex-start;
  padding: 7px 26px 0;
  z-index: 6;
}
.bb-cell { flex: 1; text-align: center; min-width: 0; }
.bb-tick {
  width: 30px; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.16);
  margin: 0 auto 6px;
}
.bb-label {
  font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase;
  color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bb-cell.on .bb-tick    { background: rgba(255,255,255,0.34); }
.bb-cell.on .bb-label   { color: var(--text-dim); }
.bb-cell.armed .bb-tick { background: var(--fader-focus); }
.bb-cell.armed .bb-label{ color: var(--fader-focus); }

/* Views sit below the legend. */
.view { display: none; width: 800px; height: 480px; flex-direction: column; padding-top: 40px; }
.view.active { display: flex; }

.view-title {
  height: 30px; line-height: 30px; text-align: center;
  font-size: 16px; font-weight: bold;
  letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--text-dim);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  padding: 0 120px;
}

/* ---------- now playing ---------- */
#np-body { flex: 1; display: flex; align-items: center; padding: 0 34px 10px; }

#np-art {
  width: 268px; height: 268px; flex: none;
  border-radius: 14px;
  background: linear-gradient(150deg, #2f4a63, #1d2c3b);
  background-size: cover; background-position: center;
  margin-right: 34px;
  overflow: hidden;
}

#np-info { flex: 1; min-width: 0; }

#np-title {
  font-size: 40px; font-weight: bold; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#np-artist {
  font-size: 23px; color: var(--text-dim);
  margin-top: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#np-progress {
  height: 6px; border-radius: 3px;
  background: var(--track);
  margin-top: 30px;
  overflow: hidden;
}
#np-progress-fill {
  height: 100%; width: 0%;
  background: var(--accent);
  border-radius: 3px;
}
#np-times {
  display: flex; justify-content: space-between;
  font-size: 15px; color: var(--text-dim);
  margin-top: 9px;
}

#np-controls { display: flex; align-items: center; margin-top: 22px; }
/* Generous tap targets — this is a touchscreen reached at arm's length, so the
   hit area is deliberately larger than the glyph it contains. */
.ctl {
  width: 104px; height: 84px;
  display: flex; align-items: center; justify-content: center;
  margin-right: 14px;
  border-radius: 14px;
}
.ctl svg { fill: var(--text); }
/* Press feedback on the whole target, not just the glyph, so a tap that lands
   near the edge still visibly registers. */
.ctl:active { background: rgba(255,255,255,0.12); }
.ctl:active svg { fill: var(--text-dim); }

/* ---------- idle clock ----------
 * Takes over the Now Playing screen while nothing is playing: an analog face
 * in the style of Apple's Snoopy watch faces — halftone paper, hand-lettered
 * numerals, Snoopy on his doghouse with Woodstock. Everything is one static
 * SVG; the only per-second work is rotating three hands. The little bits of
 * life (blink, chatter, a drifting leaf, Zs at night) are driven off that same
 * tick or are short CSS transform animations on their own layers. */
#clock {
  display: none;
  position: absolute; top: 0; left: 0;
  width: 800px; height: 480px;
  overflow: hidden;
  background-color: #a3d6ae;
  /* Halftone dots over a soft centre glow. */
  background-image:
    radial-gradient(circle, rgba(0,0,0,0.09) 1.3px, transparent 1.8px),
    radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.38), rgba(255,255,255,0) 70%);
  background-size: 7px 7px, 100% 100%;
}
#clock.morning { background-color: #f6d47a; }
#clock.day     { background-color: #a3d6ae; }
#clock.evening { background-color: #f3a15f; }
#clock.night   { background-color: #7276c6; }

#app.idle #now-playing-view.active { display: none; }
#app.idle #clock { display: block; }
/* Bezel legend in ink rather than white, so it sits on the paper. */
#app.idle .bb-tick        { background: rgba(0,0,0,0.12); }
#app.idle .bb-cell.on .bb-tick  { background: rgba(0,0,0,0.22); }
#app.idle .bb-label       { color: rgba(0,0,0,0.28); }
#app.idle .bb-cell.on .bb-label { color: rgba(0,0,0,0.42); }

#clock svg { position: absolute; top: 0; left: 0; }

/* Day/night poses. */
.sleep { display: none; }
#clock.night .awake { display: none; }
#clock.night .sleep { display: inline; }
.shut { display: none; }
#clock.blink .open { display: none; }
#clock.blink .shut { display: inline; }

/* Real character art (art/*.png), positioned on the doghouse roof. The drawn
   versions only show when that art is missing. */
.art-img { display: none; position: absolute; }
#clock.art .art-img { display: block; }
#clock.art .drawn { display: none; }
#art-snoopy { left: 317px; top: 224px; }
/* Woodstock's art faces left, as Snoopy's does; mirrored and on Snoopy's left
   so the two face each other. */
#art-woodstock {
  left: 226px; top: 296px;
  -webkit-transform: scaleX(-1); transform: scaleX(-1);
  will-change: transform;
  -webkit-animation: ws-hover 3s ease-in-out infinite; animation: ws-hover 3s ease-in-out infinite;
}
#clock.night #art-woodstock { -webkit-animation: none; animation: none; }
@-webkit-keyframes ws-hover {
  0%, 100% { -webkit-transform: scaleX(-1); }
  50% { -webkit-transform: translateY(-8px) scaleX(-1); }
}
@keyframes ws-hover {
  0%, 100% { transform: scaleX(-1); }
  50% { transform: translateY(-8px) scaleX(-1); }
}
#clock.art #ws-bubble { -webkit-transform: translate(-300px, -26px); transform: translate(-300px, -26px); }

#ws-bubble { display: none; }
#clock.chat #ws-bubble { display: inline; }
#clock.night #ws-bubble { display: none; }
#clock.hop #ws-body { -webkit-animation: ws-hop 0.5s ease-out 2; animation: ws-hop 0.5s ease-out 2; }
@-webkit-keyframes ws-hop { 50% { -webkit-transform: translateY(-9px); } }
@keyframes ws-hop { 50% { transform: translateY(-9px); } }

/* A leaf blown across the sky now and then. Own layer, transform only. */
.leaf {
  position: absolute; top: 0; left: 0;
  width: 34px; height: 22px;
  visibility: hidden;
  will-change: transform;
}
.leaf.go {
  visibility: visible;
  -webkit-animation: leaf-drift 9s linear 1; animation: leaf-drift 9s linear 1;
}
@-webkit-keyframes leaf-drift {
  0%   { -webkit-transform: translate(830px, 120px) rotate(0deg); }
  25%  { -webkit-transform: translate(610px, 165px) rotate(-70deg); }
  50%  { -webkit-transform: translate(400px, 130px) rotate(-150deg); }
  75%  { -webkit-transform: translate(190px, 185px) rotate(-230deg); }
  100% { -webkit-transform: translate(-60px, 150px) rotate(-320deg); }
}
@keyframes leaf-drift {
  0%   { transform: translate(830px, 120px) rotate(0deg); }
  25%  { transform: translate(610px, 165px) rotate(-70deg); }
  50%  { transform: translate(400px, 130px) rotate(-150deg); }
  75%  { transform: translate(190px, 185px) rotate(-230deg); }
  100% { transform: translate(-60px, 150px) rotate(-320deg); }
}

/* Wallpaper scenes: a full picture with a digital clock over it. Declared
   after the classic rules so .wall wins where they overlap. */
#clock-wall, #clock-digital { display: none; position: absolute; }
#clock-wall { top: 0; left: 0; }
#clock.wall #clock-wall,
#clock.wall #clock-digital { display: block; }
#clock.wall .classic { display: none; }

#clock-digital {
  top: 44px; left: 0; width: 800px;
  padding: 0 40px;
  text-align: center;
  font-family: "Schoolbell", "Circular Sp UI v3 T", sans-serif;
  color: #1d1d1d;
  /* A soft halo keeps the time readable over any part of the picture. */
  text-shadow: 0 0 3px #fff, 0 0 10px rgba(255,255,255,0.85), 0 0 22px rgba(255,255,255,0.6);
}
#clock-digital.pos-left  { text-align: left; }
#clock-digital.pos-right { text-align: right; }
/* Schoolbell has a single weight; synthetic bold smears it, so none here. */
#cd-time { font-size: 128px; line-height: 1; }
#cd-ampm { font-size: 42px; margin-left: 10px; }
#cd-date {
  font-size: 34px; letter-spacing: 2px; text-transform: uppercase;
  margin-top: 2px;
}
#app.idle-light #clock-digital {
  color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,0.7), 0 0 12px rgba(0,0,0,0.55), 0 0 24px rgba(0,0,0,0.4);
}
#app.idle.idle-light .bb-tick        { background: rgba(255,255,255,0.16); }
#app.idle.idle-light .bb-cell.on .bb-tick  { background: rgba(255,255,255,0.3); }
#app.idle.idle-light .bb-label       { color: rgba(255,255,255,0.35); }
#app.idle.idle-light .bb-cell.on .bb-label { color: rgba(255,255,255,0.55); }

/* Night: Zs rising from the doghouse. */
.zz {
  position: absolute; top: 0; left: 0;
  font: bold 26px "Noto Sans", sans-serif; color: #1d1d1d;
  opacity: 0;
  will-change: transform, opacity;
}
#clock.night .zz { -webkit-animation: zz-rise 6s ease-out infinite; animation: zz-rise 6s ease-out infinite; }
#clock.night .zz.z2 { -webkit-animation-delay: 2s; animation-delay: 2s; }
#clock.night .zz.z3 { -webkit-animation-delay: 4s; animation-delay: 4s; }
@-webkit-keyframes zz-rise {
  0%   { opacity: 0; -webkit-transform: translate(470px, 250px) scale(0.6); }
  15%  { opacity: 1; }
  100% { opacity: 0; -webkit-transform: translate(530px, 140px) scale(1.2); }
}
@keyframes zz-rise {
  0%   { opacity: 0; transform: translate(470px, 250px) scale(0.6); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: translate(530px, 140px) scale(1.2); }
}

/* ---------- mixer ---------- */
#save-btn {
  position: absolute; top: 46px; right: 22px;
  padding: 8px 16px; border-radius: 16px;
  border: 1px solid var(--text-faint);
  font-size: 14px; letter-spacing: 1.2px; color: var(--text-dim);
  z-index: 5;
}
#save-btn.armed { border-color: var(--fader-focus); color: var(--fader-focus); }

#faders { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 6px 40px 42px; }
.fader { width: 150px; margin: 0 22px; text-align: center; }
.fader-pct { font-size: 30px; font-weight: bold; margin-bottom: 12px; }
.fader-track {
  height: 232px; border-radius: 10px;
  background: var(--track);
  position: relative; overflow: hidden;
}
.fader-fill {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--fader);
  border-radius: 10px;
}
.fader.focus .fader-fill { background: var(--fader-focus); }
.fader-name {
  font-size: 15px; letter-spacing: 1.6px; color: var(--text-dim);
  margin-top: 12px;
}
.fader.dead { opacity: 0.34; }

/* ---------- playlists ---------- */
/* 4x2 grid of covers. Grid (and gap within grid) is fine on Chromium 69; only
   flexbox gap is missing. The hint bar is gone — two rows of covers need the
   height, and the button legend above already names what 1 and 2 do. */
#pl-list {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  gap: 12px 16px;
  padding: 4px 30px 14px;
  overflow: hidden;
}
.pl-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  border-radius: 12px; padding: 7px 5px 5px;
  min-width: 0;
}
.pl-thumb {
  width: 138px; height: 138px; flex: none;
  border-radius: 9px;
  background: #253243 center/cover no-repeat;
}
.pl-name {
  margin-top: 7px; width: 100%;
  font-size: 15px; color: var(--text-dim); text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-tile.sel { background: rgba(255,255,255,0.13); }
.pl-tile.sel .pl-name { color: var(--text); font-weight: bold; }

/* ---------- message ---------- */
#message {
  display: none;
  position: absolute; top: 0; left: 0;
  width: 800px; height: 480px;
  align-items: center; justify-content: center;
  padding: 0 70px; text-align: center;
  background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
  font-size: 24px; color: var(--text-dim); line-height: 1.5;
  z-index: 10;
}

/* Transient centre overlay (playlist PLAYING / ERROR, saved-preset flash). */
#toast {
  display: none;
  position: absolute; top: 50%; left: 50%;
  -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
  padding: 18px 34px; border-radius: 14px;
  background: rgba(0,0,0,0.72);
  font-size: 26px; font-weight: bold; letter-spacing: 1.5px;
  z-index: 20;
}
#toast.show { display: block; }

#dbg {
  position: fixed; left: 6px; bottom: 4px; z-index: 999;
  color: #0f0; opacity: 0.85; font-size: 13px;
  font-family: monospace; pointer-events: none;
  max-width: 788px; white-space: pre-wrap; word-break: break-all;
}
</style>
</head>
<body>
<div id="app">

  <!-- Physical 1/2/3/4 button legend, aligned to the bezel buttons above the
       screen. Shared by every view; contents change with the view. -->
  <div id="btnbar">
    <div class="bb-cell" id="bb-1"><div class="bb-tick"></div><div class="bb-label"></div></div>
    <div class="bb-cell" id="bb-2"><div class="bb-tick"></div><div class="bb-label"></div></div>
    <div class="bb-cell" id="bb-3"><div class="bb-tick"></div><div class="bb-label"></div></div>
    <div class="bb-cell" id="bb-4"><div class="bb-tick"></div><div class="bb-label"></div></div>
  </div>

  <!-- Now Playing (home screen) -->
  <div class="view" id="now-playing-view">
    <div id="np-body">
      <div id="np-art"></div>
      <div id="np-info">
        <div id="np-title">Nothing playing</div>
        <div id="np-artist"></div>
        <div id="np-progress"><div id="np-progress-fill"></div></div>
        <div id="np-times"><span id="np-elapsed">0:00</span><span id="np-remain">-0:00</span></div>
        <div id="np-controls">
          <div class="ctl" id="btn-prev">
            <svg width="44" height="44" viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
          </div>
          <div class="ctl" id="btn-playpause">
            <svg width="56" height="56" viewBox="0 0 24 24" id="pp-icon"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
          </div>
          <div class="ctl" id="btn-next">
            <svg width="44" height="44" viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mixer -->
  <div class="view" id="mixer-view">
    <div id="save-btn">SAVE</div>
    <div class="view-title" id="mix-header">Volume</div>
    <div id="faders"></div>
  </div>

  <!-- Playlists -->
  <div class="view" id="playlists-view">
    <div class="view-title">Playlists</div>
    <div id="pl-list"></div>
  </div>

  <!-- Idle clock: replaces Now Playing while nothing is playing. -->
  <div id="clock">
    <!-- Wallpaper scenes (art/scenes/) are drawn here, fitted to the screen. -->
    <canvas id="clock-wall" width="800" height="480"></canvas>

    <svg class="classic" width="800" height="480" viewBox="0 0 800 480"
         stroke="#1d1d1d" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <!-- Hand-lettered digits, drawn as marker strokes in a 20x30 box. -->
        <path id="dg0" d="M10 2C4 2 1.5 9 1.5 15.5C1.5 23 5 28.5 10 28.5C15.5 28.5 18.5 22 18.5 15C18.5 8 15.5 2 10 2Z"/>
        <path id="dg1" d="M4.5 7.5L11 1.5L11 28.5"/>
        <path id="dg2" d="M2.5 8C3 3.5 6.5 1.5 10 1.5C14.5 1.5 17.5 4.5 17.5 8.5C17.5 13.5 11 19 2 28.5L19 28"/>
        <path id="dg3" d="M3 4.5C6 1.5 15.5 0 16.5 7C17 11.5 12.5 14 8 14C14 14 18.5 17 18.5 21.5C18.5 27.5 9.5 30 2.5 26"/>
        <path id="dg4" d="M14 28.5L14 1.5L2 20L19 20"/>
        <path id="dg5" d="M17 2L5.5 2L4.5 13C7.5 11 10.5 11 13 12C18 14 19 19 18 23C16.5 28 8 30 3 26"/>
        <path id="dg6" d="M15.5 2C8 4 2 12 2 20C2 25.5 5.5 28.5 10 28.5C15 28.5 18 25 18 20.5C18 15.5 14 13 10 13C6 13 3 15.5 2.2 19"/>
        <path id="dg7" d="M2 2L18.5 2L7 28.5"/>
        <path id="dg8" d="M10 14C5 14 3 11 3 7.5C3 4 6 1.5 10 1.5C14 1.5 17 4 17 7.5C17 11 15 14 10 14C5 14 2 17 2 21.5C2 25.5 5 28.5 10 28.5C15 28.5 18 25.5 18 21.5C18 17 15 14 10 14Z"/>
        <path id="dg9" d="M18 10C18 5 15 2 10 2C5 2 2 5 2 10C2 14.5 5 17 10 17C14 17 17 15 18 10C18 18 16 24 8 28.5"/>
      </defs>

      <!-- Numerals are placed by buildClockFace(). -->
      <g id="clock-nums" fill="none" stroke-width="2.6"></g>

      <!-- Sky: clouds by day, moon and stars at night. -->
      <g class="awake" fill="#fff" stroke-width="3">
        <path transform="translate(196 176) scale(1.2)" d="M0 0C-8 0 -12 -10 -4 -14C-4 -24 10 -28 16 -20C20 -30 38 -30 40 -18C50 -20 56 -8 48 0Z"/>
        <path transform="translate(560 178) scale(1.2)" d="M0 0C-8 0 -12 -10 -4 -14C-4 -24 10 -28 16 -20C20 -30 38 -30 40 -18C50 -20 56 -8 48 0Z"/>
      </g>
      <g class="sleep" fill="#fff6c2" stroke-width="2.6">
        <path transform="translate(598 168)" d="M0 -24A24 24 0 1 0 24 6A18 18 0 1 1 0 -24Z"/>
        <g stroke="none">
          <path transform="translate(212 170)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
          <path transform="translate(262 300) scale(0.7)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
          <path transform="translate(170 250) scale(0.6)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
          <path transform="translate(650 270) scale(0.8)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
          <path transform="translate(540 120) scale(0.6)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
          <path transform="translate(330 140) scale(0.7)" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z"/>
        </g>
      </g>

      <!-- Doghouse, side on, running off the bottom of the screen. -->
      <g stroke-width="3.5">
        <path d="M250 437L560 437L560 492L250 492Z" fill="#c9221f"/>
        <path d="M226 408L584 408L592 439L218 439Z" fill="#e5352f"/>
        <path d="M262 455L300 455M318 470L380 470M430 460L470 460M500 474L540 474" fill="none" stroke-width="2.5"/>
      </g>

      <!-- Drawn Snoopy, sitting on the roof, facing right. Origin = his seat.
           Only shown if the real art in art/ is missing. -->
      <g class="drawn" transform="translate(412 409)" stroke-width="3.4">

      <path d="M2 14C12 10 22 8 32 6" fill="none" stroke-width="1.6"/>
    </svg>
    <div class="zz classic">Z</div><div class="zz z2 classic">z</div><div class="zz z3 classic">Z</div>

    <!-- Digital readout for wallpaper scenes, which are too busy for numerals. -->
    <div id="clock-digital">
      <div id="cd-time"><span id="cd-hm"></span><span id="cd-ampm"></span></div>
      <div id="cd-date"></div>

  <div id="toast"></div>

  <div id="dbg"></div>

</div>

<script>
/* =========================================================
 *  CONFIG
 * ========================================================= */
const SERVER = 'http://localhost:5005';
const SPOTIFY_POLL_MS = 5000;
const STATUS_POLL_MS = 4000;

// Set true to print the last key / hardware-websocket event bottom-left; used to
// identify the Car Thing's back button.
const DEBUG_INPUT = false;
function dbg(label, data) {
  if (!DEBUG_INPUT) return;
  const el = document.getElementById('dbg');
  if (el) el.textContent = label + ': ' + data;
}

// No Spotify credentials reach this webapp. server.py holds the client id,
// secret and refresh token in presets.json and proxies every Spotify call.

/* =========================================================
 *  STATE
 * ========================================================= */
const STATE = {
  config: null,           // /presets payload
  activePreset: null,
  view: 'np',             // 'mixer' | 'np' | 'playlists' — Now Playing is home
  volumes: {},            // live per-speaker volumes (0..1)
  unavailable: {},        // speaker key -> reason the server can't drive it
  focus: null,            // speaker key the dial controls, or null = ALL
  spotify: {
    track: null, artist: null, album: null, artUrl: null, playing: false,
    progressMs: 0, durationMs: 0, at: 0,   // for the local progress ticker
  },
};

const SPEAKER_ORDER = ['nest_audio', 'google_home', 'chromecast'];
const SPEAKER_LABELS = { nest_audio: 'NEST', google_home: 'HOME', chromecast: 'CAST' };
const VOL_STEP = 0.05;      // per dial detent / arrow key
const NP_RETURN_MS = 12000; // idle delay before the mixer reverts to Now Playing
const SAVE_ARM_MS = 6000;   // how long "save" stays armed waiting for a preset

let focusTimer = null;
let npReturnTimer = null;
let mixerBuilt = false;
let saveArmed = false;
let saveArmTimer = null;

/* Only touch the DOM when a value actually changed — on this SoC a redundant
   textContent write still costs a style recalc. */
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }

let toastTimer = null;
function showToast(text, ms) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() {
  document.getElementById('toast').classList.remove('show');
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
}

function scheduleReturnToNowPlaying() {
  if (npReturnTimer) clearTimeout(npReturnTimer);
  npReturnTimer = setTimeout(() => {
    npReturnTimer = null;
    if (STATE.view === 'mixer') { STATE.view = 'np'; applyView(); }
  }, NP_RETURN_MS);
}
function cancelReturnToNowPlaying() {
  if (npReturnTimer) { clearTimeout(npReturnTimer); npReturnTimer = null; }
}

/* =========================================================
 *  SERVER
 * ========================================================= */
async function fetchConfig() {
  // Throws on failure so init() can retry — at boot the USB tunnel may not be
  // up yet, and "server unreachable" must not be read as "not configured".
  const r = await fetch(SERVER + '/presets', { cache: 'no-store' });
  if (!r.ok) throw new Error('presets HTTP ' + r.status);
  STATE.config = await r.json();
}

async function fetchStatus() {
  try {
    const r = await fetch(SERVER + '/status', { cache: 'no-store' });
    const j = await r.json();
    STATE.activePreset = j.active_preset;
    if (j.volumes) STATE.volumes = j.volumes;
    STATE.unavailable = j.unavailable || {};
  } catch (e) {}
}

/* =========================================================
 *  VIEWS
 * ========================================================= */
/* Keep the bezel-button labels in step with what each button currently does.
   Cells are in physical order left-to-right, so a label sits under its button. */
function renderButtonBar() {
  const presets = (STATE.config && STATE.config.presets) || {};
  const pname = (id) => (presets[id] && presets[id].name) || ('PRESET ' + id);
  let labels, live;
  if (STATE.view === 'playlists') {
    labels = ['Play', 'Refresh', '', ''];   // 3 and 4 are unbound here
    live = [true, true, false, false];
  } else {
    labels = [pname('1'), pname('2'), pname('3'),
              STATE.view === 'mixer' ? 'Now Playing' : 'Mixer'];
    live = [true, true, true, true];
  }
  const arming = saveArmed && STATE.view !== 'playlists';
  for (let i = 0; i < 4; i++) {
    const cell = document.getElementById('bb-' + (i + 1));
    if (!cell) continue;
    setText(cell.querySelector('.bb-label'), labels[i]);
    cell.classList.toggle('on', live[i] && !!labels[i]);
    cell.classList.toggle('armed', arming && i < 3);
  }
}

function applyView() {
  const v = STATE.view;
  document.getElementById('now-playing-view').classList.toggle('active', v === 'np');
  document.getElementById('mixer-view').classList.toggle('active', v === 'mixer');
  document.getElementById('playlists-view').classList.toggle('active', v === 'playlists');
  document.getElementById('message').style.display = 'none';
  if (v !== 'np') setClockActive(false);
  renderButtonBar();
  if (v === 'mixer') renderMixer();
  else if (v === 'np') renderNowPlaying();
  else renderPlaylists();
}

function toggleView() {
  STATE.view = (STATE.view === 'mixer') ? 'np' : 'mixer';
  applyView();
  if (STATE.view === 'mixer') scheduleReturnToNowPlaying();
  else cancelReturnToNowPlaying();
}

/* =========================================================
 *  MIXER
 * ========================================================= */
function buildFaders() {
  if (mixerBuilt) return;
  const wrap = document.getElementById('faders');
  wrap.innerHTML = '';
  SPEAKER_ORDER.forEach((sp) => {
    const f = document.createElement('div');
    f.className = 'fader';
    f.dataset.sp = sp;
    f.innerHTML =
      '<div class="fader-pct"></div>' +
      '<div class="fader-track"><div class="fader-fill"></div></div>' +
      '<div class="fader-name"></div>';
    f.addEventListener('click', () => focusDevice(sp));
    wrap.appendChild(f);
  });
  mixerBuilt = true;
}

function renderMixer() {
  buildFaders();
  let title = 'Volume';
  if (saveArmed) title = 'Save to 1 / 2 / 3';
  else if (STATE.focus) title = SPEAKER_LABELS[STATE.focus] || STATE.focus;
  else if (STATE.activePreset && STATE.config && STATE.config.presets) {
    const p = STATE.config.presets[STATE.activePreset];
    if (p && p.name) title = p.name;
  }
  setText(document.getElementById('mix-header'), title);
  document.getElementById('save-btn').classList.toggle('armed', saveArmed);
  renderButtonBar();

  const faders = document.querySelectorAll('#faders .fader');
  for (let i = 0; i < faders.length; i++) {
    const f = faders[i];
    const sp = f.dataset.sp;
    const v = Math.max(0, Math.min(1, STATE.volumes[sp] || 0));
    // The server reports speakers it can't drive (offline, or a TV that isn't
    // casting). Dim those so the dial visibly does nothing on them, rather than
    // looking live while every turn is discarded.
    const dead = !!STATE.unavailable[sp];
    f.classList.toggle('dead', dead);
    f.classList.toggle('focus', STATE.focus === sp && !dead);
    f.querySelector('.fader-fill').style.height = (v * 100) + '%';
    setText(f.querySelector('.fader-pct'), dead ? '--' : String(Math.round(v * 100)));
    setText(f.querySelector('.fader-name'), SPEAKER_LABELS[sp] || sp);
  }
}

function focusDevice(sp) {
  STATE.focus = sp;
  armFocusTimeout();
  scheduleReturnToNowPlaying();
  renderMixer();
}

function armFocusTimeout() {
  if (focusTimer) clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { STATE.focus = null; renderMixer(); }, 4000);
}

async function activatePreset(id) {
  try {
    const r = await fetch(SERVER + '/preset/' + id, { method: 'POST' });
    const j = await r.json();
    if (j && j.volumes) STATE.volumes = j.volumes;
    STATE.activePreset = id;
  } catch (e) { console.error('preset error', e); }
  if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
  else renderMixer();
  scheduleReturnToNowPlaying();
}

function armSave() {
  saveArmed = !saveArmed;
  if (saveArmTimer) clearTimeout(saveArmTimer);
  if (saveArmed) saveArmTimer = setTimeout(() => { saveArmed = false; renderMixer(); }, SAVE_ARM_MS);
  scheduleReturnToNowPlaying();
  renderMixer();
}

async function savePreset(id) {
  saveArmed = false;
  if (saveArmTimer) { clearTimeout(saveArmTimer); saveArmTimer = null; }
  try {
    const r = await fetch(SERVER + '/preset/' + id + '/save', { method: 'POST' });
    const j = await r.json();
    if (j && j.ok) {
      if (STATE.config && STATE.config.presets && STATE.config.presets[id] && j.levels) {
        Object.assign(STATE.config.presets[id], j.levels);
      }
      showToast('SAVED  ' + ((j.preset || '').toUpperCase() || id), 1800);
      STATE.activePreset = id;
    }
  } catch (e) { console.error('save preset error', e); }
  scheduleReturnToNowPlaying();
  renderMixer();
}

/* =========================================================
 *  VOLUME
 * ========================================================= */
// One request in flight at a time. The dial can emit detents faster than a
// round trip completes; without this they queue and keep landing after you stop
// turning, so the volume appears to drift on its own. Extra turns accumulate
// here and go out as a single combined delta on the next request.
let volInFlight = false;
let volPending = 0;

async function adjustVolume(delta) {
  // Turning the dial shows the mixer so you can see it move; it reverts to Now
  // Playing after a short idle.
  if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
  scheduleReturnToNowPlaying();
  if (STATE.focus) armFocusTimeout();

  // A focused fader the server can't drive would swallow every turn silently.
  if (STATE.focus && STATE.unavailable[STATE.focus]) { renderMixer(); return; }

  volPending += delta;
  if (volInFlight) return;
  volInFlight = true;
  try {
    while (volPending !== 0) {
      const d = volPending;
      volPending = 0;
      const body = { delta: d };
      if (STATE.focus) body.speaker = STATE.focus;
      const r = await fetch(SERVER + '/volume/adjust', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (j && j.volumes) STATE.volumes = j.volumes;
      if (j && j.unavailable) STATE.unavailable = j.unavailable;
      // The server refuses writes to a speaker it can't reach. Say so rather
      // than letting the dial feel dead.
      if (j && j.ok === false && j.error) showToast(j.error.toUpperCase(), 1600);
      renderMixer();
    }
  } catch (e) {
    console.error('volume adjust error', e);
  } finally {
    volInFlight = false;
  }
}

/* =========================================================
 *  NOW PLAYING
 * ========================================================= */
async function pollSpotify() {
  try {
    const r = await fetch(SERVER + '/spotify/now-playing', { cache: 'no-store' });
    if (!r.ok) return;
    handleNowPlaying(await r.json());
  } catch (e) { console.error('spotify poll error', e); }
}

async function spotifyControl(action) {
  try { await fetch(SERVER + '/spotify/' + action, { method: 'POST' }); }
  catch (e) { console.error('spotify control error', e); }
  setTimeout(pollSpotify, 350);
  setTimeout(pollSpotify, 1200);
}

function handleNowPlaying(j) {
  const s = STATE.spotify;
  if (!j || !j.item) {
    s.playing = false;
    s.track = null; s.artist = null; s.album = null; s.artUrl = null;
    s.progressMs = 0; s.durationMs = 0; s.at = Date.now();
  } else {
    s.playing = !!j.is_playing;
    s.track = j.item.name || '';
    s.artist = (j.item.artists || []).map(a => a.name).join(', ');
    s.album = (j.item.album && j.item.album.name) || '';
    s.progressMs = j.progress_ms || 0;
    s.durationMs = j.item.duration_ms || 0;
    s.at = Date.now();
    const imgs = (j.item.album && j.item.album.images) || [];
    // Album art lives on the Spotify CDN, which the device can't reach — the
    // server proxies it.
    s.artUrl = imgs.length ? (SERVER + '/spotify/art?u=' + encodeURIComponent(imgs[0].url)) : null;
  }
  if (STATE.view === 'np') renderNowPlaying();
}

function fmtTime(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const sec = total % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* Elapsed position, extrapolated between polls so the bar moves smoothly
   without polling the server every second. */
const RESTART_THRESHOLD_MS = 5000;

function currentProgressMs() {
  const s = STATE.spotify;
  let ms = s.progressMs;
  if (s.playing) ms += (Date.now() - s.at);
  if (s.durationMs) ms = Math.min(ms, s.durationMs);
  return ms;
}

// Falling back to 'none' would also clear the CSS placeholder gradient, leaving
// an invisible square for tracks with no artwork.
const ART_PLACEHOLDER = 'linear-gradient(150deg, #2f4a63, #1d2c3b)';
let lastArtUrl = null;
function renderNowPlaying() {
  const s = STATE.spotify;
  setClockActive(!s.track);
  setText(document.getElementById('np-title'), s.track || 'Nothing playing');
  setText(document.getElementById('np-artist'), s.artist || '');

  // Only reassign the background when the URL changes — otherwise every poll
  // re-hits the server's art proxy.
  if (s.artUrl !== lastArtUrl) {
    lastArtUrl = s.artUrl;
    document.getElementById('np-art').style.backgroundImage =
      s.artUrl ? ('url("' + s.artUrl + '")') : ART_PLACEHOLDER;
  }

  // Play/pause glyph: two bars when playing, triangle when paused.
  const icon = document.getElementById('pp-icon');
  const want = s.playing ? 'M7 4h4v16H7zM13 4h4v16h-4z' : 'M7 4l13 8-13 8z';
  const path = icon.firstElementChild || icon.querySelector('path');
  if (path && path.getAttribute('d') !== want) path.setAttribute('d', want);

  renderProgress();
}

function renderProgress() {
  const s = STATE.spotify;
  const ms = currentProgressMs();
  const pct = s.durationMs ? Math.max(0, Math.min(100, (ms / s.durationMs) * 100)) : 0;
  const fill = document.getElementById('np-progress-fill');
  const w = pct.toFixed(1) + '%';
  if (fill.style.width !== w) fill.style.width = w;
  setText(document.getElementById('np-elapsed'), fmtTime(ms));
  setText(document.getElementById('np-remain'), s.durationMs ? '-' + fmtTime(s.durationMs - ms) : '-0:00');
}

/* =========================================================
 *  IDLE CLOCK
 *  Shown in place of Now Playing while nothing is playing. The buttons and
 *  dial keep their Now Playing meanings — this is only a different face.
 * ========================================================= */
const CLOCK_CX = 400, CLOCK_CY = 234;   // hand pivot, just above Snoopy's head
const CLOCK_RX = 290, CLOCK_RY = 172;   // numeral ring: a squircle, like the watch
const DIGIT_SCALE = 1.45;               // 20x30 digit box -> ~29x44 px
const LEAF_EVERY_S = 45;

/* Which face shows when. Each entry runs from its hour until the next one's.
   `file` is a picture in art/scenes/ (any of .jpg/.png/.jpeg/.webp), shown full
   screen with a digital clock; null is the analog doghouse face. `winter`
   replaces `file` in December–February. `pos` places the digital readout
   (left/top/right) clear of the characters; `light` = white text for dark
   pictures; `fit: 'cover'` always fills the screen (see drawWall). A missing
   picture falls back to the analog face. */
const CLOCK_SCENES = [
  { from: 6,  file: 'meadow',   pos: 'top', fit: 'cover' },   // flowers at the edges smear if stretched
  { from: 9,  file: 'tree',     pos: 'left', winter: 'sled' },
  { from: 12, file: null },
  { from: 15, file: 'skates',   pos: 'left' },
  { from: 18, file: 'doghouse', pos: 'top' },
  { from: 21, file: 'space',    pos: 'left', light: true },
];
const SCENE_EXTS = ['jpg', 'png', 'jpeg', 'webp'];
// Cover-fit a picture if that crops at most this much of it; otherwise fit the
// whole picture and extend its edges out to the screen.
const SCENE_MAX_CROP = 0.15;
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const CHAT_EVERY_S = 40;                // Woodstock pipes up for 6s of every 40

let clockBuilt = false;
let clockTimer = null;
let blinkTimer = null;
const clockLast = { h: null, m: null, s: null, phase: null };
let sceneFile;   // file of the scene currently shown or loading; null = analog

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* Place the numerals on the ring at their true angles, so the hands read
   correctly. 5, 6 and 7 would sit behind the doghouse, so — as on the watch —
   they're left out. */
function buildClockFace() {
  if (clockBuilt) return;
  const g = document.getElementById('clock-nums');
  const advance = 20 * DIGIT_SCALE + 3;
  for (let n = 1; n <= 12; n++) {
    if (n >= 5 && n <= 7) continue;
    const a = n * Math.PI / 6;
    const dx = Math.sin(a), dy = -Math.cos(a);
    const r = Math.pow(Math.pow(Math.abs(dx) / CLOCK_RX, 4) + Math.pow(Math.abs(dy) / CLOCK_RY, 4), -0.25);
    const digits = String(n);
    const x0 = CLOCK_CX + dx * r - (digits.length * advance - 3) / 2;
    const y0 = CLOCK_CY + dy * r - 15 * DIGIT_SCALE;
    for (let i = 0; i < digits.length; i++) {
      g.appendChild(svgEl('use', {
        href: '#dg' + digits[i],
        transform: 'translate(' + (x0 + i * advance).toFixed(1) + ' ' + y0.toFixed(1) + ') scale(' + DIGIT_SCALE + ')',
      }));
    }
  }
  const leaf = document.querySelector('#clock .leaf');
  leaf.addEventListener('animationend', () => leaf.classList.remove('go'));
  leaf.addEventListener('webkitAnimationEnd', () => leaf.classList.remove('go'));
  // Swap in the real art once both images load; if they aren't on the device,
  // the drawn fallback simply stays.
  let artLoaded = 0;
  ['snoopy', 'woodstock'].forEach((name) => {
    const img = document.getElementById('art-' + name);
    img.addEventListener('load', () => { if (++artLoaded === 2) clockEl().classList.add('art'); });
    img.src = 'art/' + name + '.png';
  });
  const ws = document.getElementById('ws-body');
  ws.addEventListener('animationend', () => clockEl().classList.remove('hop'));
  ws.addEventListener('webkitAnimationEnd', () => clockEl().classList.remove('hop'));
  clockBuilt = true;
}

function clockEl() { return document.getElementById('clock'); }

function clockPhase(h) {
  if (h >= 6 && h < 11) return 'morning';
  if (h >= 11 && h < 17) return 'day';
  if (h >= 17 && h < 21) return 'evening';
  return 'night';
}

function setHand(id, deg) {
  document.getElementById(id).setAttribute('transform',
    'translate(' + CLOCK_CX + ' ' + CLOCK_CY + ') rotate(' + deg.toFixed(2) + ')');
}

function renderClock(d) {
  const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  if (s === clockLast.s && m === clockLast.m && h === clockLast.h) return;
  clockLast.s = s;
  const el = clockEl();
  if (m !== clockLast.m || h !== clockLast.h) {
    clockLast.m = m; clockLast.h = h;
    applyScene(d);
    renderDigital(d);
    setHand('hand-m', m * 6);
    setHand('hand-h', (h % 12) * 30 + m * 0.5);
  }
  const phase = clockPhase(h);
  if (phase !== clockLast.phase) {
    if (clockLast.phase) el.classList.remove(clockLast.phase);
    el.classList.add(phase);
    clockLast.phase = phase;
  }
  // Wallpaper scenes show minutes only; nothing to do between them.
  if (el.classList.contains('wall')) return;
  setHand('hand-s', s * 6);
  if (phase === 'night') { el.classList.remove('chat'); return; }

  // A little life, all keyed off the once-a-second tick.
  const t = m * 60 + s;
  const chatting = t % CHAT_EVERY_S < 6;
  if (chatting && !el.classList.contains('chat')) el.classList.add('hop');
  el.classList.toggle('chat', chatting);
  if (s % 7 === 3) {
    el.classList.add('blink');
    if (blinkTimer) clearTimeout(blinkTimer);
    blinkTimer = setTimeout(() => el.classList.remove('blink'), 160);
  }
  if (t % LEAF_EVERY_S === 20) document.querySelector('#clock .leaf').classList.add('go');
}

function renderDigital(d) {
  const h = d.getHours(), m = d.getMinutes();
  setText(document.getElementById('cd-hm'), ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m);
  setText(document.getElementById('cd-ampm'), h < 12 ? 'AM' : 'PM');
  setText(document.getElementById('cd-date'),
    DAY_NAMES[d.getDay()] + '  ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate());
}

function sceneFor(d) {
  const h = d.getHours();
  let scene = CLOCK_SCENES[CLOCK_SCENES.length - 1];   // before the first slot = last slot, wrapped
  for (let i = 0; i < CLOCK_SCENES.length; i++) {
    if (h >= CLOCK_SCENES[i].from) scene = CLOCK_SCENES[i];
  }
  const month = d.getMonth();
  const winter = month === 11 || month <= 1;
  return { scene: scene, file: (winter && scene.winter) || scene.file };
}

function setWall(scene) {
  clockEl().classList.toggle('wall', !!scene);
  document.getElementById('app').classList.toggle('idle-light', !!(scene && scene.light));
  document.getElementById('clock-digital').className = 'pos-' + ((scene && scene.pos) || 'top');
}

// Only reloads when the scene actually changes — a few times a day.
function applyScene(d) {
  const pick = sceneFor(d);
  if (pick.file === sceneFile) return;
  sceneFile = pick.file;
  if (!pick.file) { setWall(null); return; }
  const tryExt = (i) => {
    if (i >= SCENE_EXTS.length) { if (sceneFile === pick.file) setWall(null); return; }
    const img = new Image();
    img.onload = () => {
      if (sceneFile !== pick.file) return;   // superseded while loading
      drawWall(img, pick.scene.fit);
      setWall(pick.scene);
    };
    img.onerror = () => tryExt(i + 1);
    img.src = 'art/scenes/' + pick.file + '.' + SCENE_EXTS[i];
  };
  tryExt(0);
}

/* Fit a picture to the 800x480 screen. Close to the screen's shape, it's
   scaled to cover and lightly cropped. Otherwise it's shown whole and its
   outermost row/column of pixels is stretched to the screen edge, so a sky or
   flat backdrop simply continues; a slight blur hides the streaks. */
function drawWall(img, fit) {
  const W = 800, H = 480;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const cover = Math.max(W / iw, H / ih), contain = Math.min(W / iw, H / ih);
  const k = (fit === 'cover' || (1 - contain / cover) <= SCENE_MAX_CROP) ? cover : contain;
  const dw = iw * k, dh = ih * k, dx = (W - dw) / 2, dy = (H - dh) / 2;
  const ctx = document.getElementById('clock-wall').getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (k === contain) {
    // Strips run well under the picture: blur fades a strip's own edges,
    // which would otherwise show as a seam where it meets the picture.
    const o = 10;
    ctx.filter = 'blur(3px)';
    if (dx > 0) {
      ctx.drawImage(img, 2, 0, 1, ih, -o, -o, dx + 2 * o, H + 2 * o);
      ctx.drawImage(img, iw - 3, 0, 1, ih, dx + dw - o, -o, W - dx - dw + 2 * o, H + 2 * o);
    }
    if (dy > 0) {
      ctx.drawImage(img, 0, 2, iw, 1, -o, -o, W + 2 * o, dy + 2 * o);
      ctx.drawImage(img, 0, ih - 3, iw, 1, -o, dy + dh - o, W + 2 * o, H - dy - dh + 2 * o);
    }
    ctx.filter = 'none';
  }
  ctx.drawImage(img, dx, dy, dw, dh);
}

// Re-armed against the wall clock each time, so the second hand lands on the
// second instead of drifting with setInterval.
function tickClock() {
  const d = new Date();
  renderClock(d);
  clockTimer = setTimeout(tickClock, 1010 - d.getMilliseconds());
}

function setClockActive(on) {
  document.getElementById('app').classList.toggle('idle', on);
  if (on && !clockTimer) {
    buildClockFace();
    tickClock();
  } else if (!on && clockTimer) {
    clearTimeout(clockTimer);
    clockTimer = null;
  }
}

/* =========================================================
 *  PLAYLISTS
 *  Back button opens it; dial scrolls, 1 plays, 2 refreshes.
 * ========================================================= */
const PL_COLS = 4;
const PL_ROWS = 2;
const PL_VISIBLE = PL_COLS * PL_ROWS;
const playlistState = {
  items: [], selected: 0, scrollTop: 0,
  loading: false, loaded: false, error: false,
};
let plRowsBuilt = false;
let playlistFlashTimer = null;

function openPlaylists() {
  cancelReturnToNowPlaying();
  STATE.view = 'playlists';
  applyView();
  loadPlaylists(false);
}

/* Back button: Playlists -> Now Playing, or Mixer/NowPlaying -> Playlists. */
function handleBack() {
  if (STATE.view === 'playlists') {
    STATE.view = 'np';
    applyView();
    cancelReturnToNowPlaying();   // Now Playing is home; nothing to revert to
  } else {
    openPlaylists();
  }
}

async function loadPlaylists(force) {
  if (playlistState.loading) return;
  if (playlistState.loaded && !force) { renderPlaylists(); return; }
  playlistState.loading = true;
  playlistState.error = false;
  if (STATE.view === 'playlists') renderPlaylists();
  try {
    const r = await fetch(SERVER + '/spotify/playlists', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    playlistState.items = Array.isArray(arr) ? arr : [];
    playlistState.selected = 0;
    playlistState.scrollTop = 0;
    playlistState.loaded = true;
  } catch (e) {
    console.error('playlists fetch error', e);
    playlistState.error = true;
  } finally {
    playlistState.loading = false;
    if (STATE.view === 'playlists') renderPlaylists();
  }
}

function movePlaylistSelection(dir) {
  const n = playlistState.items.length;
  if (!n) return;
  playlistState.selected = Math.max(0, Math.min(n - 1, playlistState.selected + dir));
  // Scroll by whole rows, so the grid never shows a half row.
  const selRow = Math.floor(playlistState.selected / PL_COLS);
  let topRow = Math.floor(playlistState.scrollTop / PL_COLS);
  if (selRow < topRow) topRow = selRow;
  else if (selRow >= topRow + PL_ROWS) topRow = selRow - PL_ROWS + 1;
  playlistState.scrollTop = topRow * PL_COLS;
  renderPlaylists();
}

async function playSelectedPlaylist() {
  const it = playlistState.items[playlistState.selected];
  if (!it || !it.id) return;
  showToast('PLAYING');
  let ok = false;
  let failMsg = 'ERROR';
  try {
    // device_name omitted on purpose — the server uses spotify_connect_device
    // from presets.json, which never reaches the device.
    const r = await fetch(SERVER + '/spotify/play-playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playlist_uri: it.id }),
    });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && j && j.ok === true;
    // Show the server's reason. The usual failure is that nothing is playing in
    // the room yet, so the Cast group hasn't registered with Spotify.
    if (!ok) failMsg = (j && j.error === 'no active session')
      ? 'PLAY SOMETHING ON SPOTIFY FIRST'
      : ((j && j.error) ? String(j.error).toUpperCase() : 'ERROR');
  } catch (e) {
    console.error('play-playlist error', e);
  }
  if (playlistFlashTimer) clearTimeout(playlistFlashTimer);
  if (ok) {
    playlistFlashTimer = setTimeout(() => {
      hideToast();
      STATE.view = 'np';
      applyView();
      cancelReturnToNowPlaying();
      pollSpotify();
    }, 2000);
  } else {
    showToast(failMsg, 2600);
  }
}

function buildPlaylistRows() {
  if (plRowsBuilt) return;
  const list = document.getElementById('pl-list');
  list.innerHTML = '';
  for (let i = 0; i < PL_VISIBLE; i++) {
    const row = document.createElement('div');
    row.className = 'pl-tile';
    row.innerHTML = '<div class="pl-thumb"></div><div class="pl-name"></div>';
    row.addEventListener('click', (function (slot) {
      return function () {
        const idx = playlistState.scrollTop + slot;
        if (idx < playlistState.items.length) {
          playlistState.selected = idx;
          renderPlaylists();
        }
      };
    })(i));
    list.appendChild(row);
  }
  plRowsBuilt = true;
}

/* Covers go through the server's art proxy — the device can't reach the Spotify
   CDN. Only reassign when the URL actually changes: scrolling reuses the same
   six row elements, and Chromium here runs with a 1-byte disk cache, so a
   redundant assignment means a real refetch. */
function setThumb(el, url, visible) {
  if (!el) return;
  const want = visible ? 'block' : 'none';
  if (el.style.display !== want) el.style.display = want;
  const img = url ? ('url("' + SERVER + '/spotify/art?u=' + encodeURIComponent(url) + '")') : 'none';
  if (el.dataset.img !== img) {
    el.dataset.img = img;
    el.style.backgroundImage = img;
  }
}

function renderPlaylists() {
  buildPlaylistRows();
  const rows = document.querySelectorAll('#pl-list .pl-tile');
  const st = playlistState;
  let placeholder = null;
  if (st.loading && !st.items.length) placeholder = 'Loading…';
  else if (st.error) placeholder = 'Could not load playlists';
  else if (!st.items.length) placeholder = 'No playlists';

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const nameEl = row.querySelector('.pl-name');
    const thumbEl = row.querySelector('.pl-thumb');
    if (placeholder !== null) {
      setText(nameEl, i === 0 ? placeholder : '');
      setThumb(thumbEl, null, false);
      row.classList.remove('sel');
      continue;
    }
    const idx = st.scrollTop + i;
    const it = st.items[idx];
    setText(nameEl, it ? (it.name || '') : '');
    setThumb(thumbEl, it ? it.image_url : null, !!it);
    row.classList.toggle('sel', !!it && idx === st.selected);
  }
}

/* =========================================================
 *  INPUT
 * ========================================================= */
function handleScroll(dir) {
  if (STATE.view === 'playlists') movePlaylistSelection(dir > 0 ? +1 : -1);
  else adjustVolume(dir > 0 ? +VOL_STEP : -VOL_STEP);
}

function bindKeyboard() {
  window.addEventListener('keydown', (e) => {
    dbg('key', e.key + ' / code=' + e.code);
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      handleBack();
      return;
    }
    if (STATE.view === 'playlists') {
      if (e.key === '1')              playSelectedPlaylist();
      else if (e.key === '2')         loadPlaylists(true);
      else if (e.key === 'ArrowUp')   movePlaylistSelection(-1);
      else if (e.key === 'ArrowDown') movePlaylistSelection(+1);
      return;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      if (saveArmed) savePreset(e.key);
      else activatePreset(e.key);
    }
    else if (e.key === '4') { toggleView(); }
    else if (e.key === 'ArrowUp')   { adjustVolume(+VOL_STEP); }
    else if (e.key === 'ArrowDown') { adjustVolume(-VOL_STEP); }
  });

  // The rotary dial is a relative wheel encoder (REL_HWHEEL) with no keyboard
  // handler, so the webview delivers it as a DOM `wheel` event — one detent per
  // event (measured: a single detent produces exactly one event, deltaX 53).
  window.addEventListener('wheel', (e) => {
    const d = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (d > 0) handleScroll(+1);
    else if (d < 0) handleScroll(-1);
  }, { passive: true });

  document.getElementById('save-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    armSave();
  });

  // Tapping the mixer away from a fader deselects, so the dial goes back to
  // controlling all speakers together.
  document.getElementById('mixer-view').addEventListener('click', (e) => {
    if (e.target.closest('.fader') || e.target.closest('#save-btn')) return;
    if (STATE.focus) {
      STATE.focus = null;
      if (focusTimer) clearTimeout(focusTimer);
      renderMixer();
    }
    scheduleReturnToNowPlaying();
  });

  // Like most players: past the first few seconds, back restarts the song; a
  // second tap (now near 0:00) goes to the previous track.
  document.getElementById('btn-prev').addEventListener('click', () => {
    const s = STATE.spotify;
    if (s.track && currentProgressMs() > RESTART_THRESHOLD_MS) {
      // Optimistic, so a quick second tap sees 0:00 and skips back.
      s.progressMs = 0;
      s.at = Date.now();
      renderNowPlaying();
      spotifyControl('restart');
    } else {
      spotifyControl('previous');
    }
  });
  document.getElementById('btn-next').addEventListener('click', () => spotifyControl('next'));
  document.getElementById('btn-playpause').addEventListener('click', () => {
    const s = STATE.spotify;
    const action = s.playing ? 'pause' : 'play';
    // Optimistic: flip locally and re-anchor the ticker so the bar doesn't jump.
    s.progressMs = currentProgressMs();
    s.at = Date.now();
    s.playing = !s.playing;
    renderNowPlaying();
    spotifyControl(action);
  });
}

function connectHardwareWS() {
  let ws;
  try { ws = new WebSocket('ws://localhost:8890'); }
  catch (e) { return; }
  ws.onopen = () => console.log('hw ws open');
  ws.onclose = () => setTimeout(connectHardwareWS, 3000);
  ws.onerror = () => {};
  ws.onmessage = (evt) => {
    dbg('ws', evt.data);
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    // Shapes seen: {type:'button', button:1..5, action:'down'} and
    // {type:'dial'|'wheel', delta:+1|-1}. The back button arrives as its own
    // {type:'back'} or as button id 5 (id still unconfirmed on this unit).
    if (msg.type === 'back') { handleBack(); return; }
    if (msg.type === 'button' && (msg.action === 'down' || msg.action === 'short' || !msg.action)) {
      const b = String(msg.button);
      if (b === '5') { handleBack(); return; }
      if (STATE.view === 'playlists') {
        if (b === '1') playSelectedPlaylist();
        else if (b === '2') loadPlaylists(true);
        return;
      }
      if (b === '1' || b === '2' || b === '3') activatePreset(b);
      else if (b === '4') toggleView();
    } else if (msg.type === 'dial' || msg.type === 'wheel') {
      const delta = Number(msg.delta) || 0;
      if (delta > 0) handleScroll(+1);
      else if (delta < 0) handleScroll(-1);
    }
  };
}

/* =========================================================
 *  MESSAGE / START
 * ========================================================= */
function showMessage(text) {
  setClockActive(false);
  document.getElementById('now-playing-view').classList.remove('active');
  document.getElementById('mixer-view').classList.remove('active');
  document.getElementById('playlists-view').classList.remove('active');
  const msg = document.getElementById('message');
  msg.style.display = 'flex';
  setText(document.getElementById('message-text'), text);
}

async function startPlayer() {
  await fetchStatus();
  applyView();
  bindKeyboard();
  connectHardwareWS();

  setInterval(async () => {
    await fetchStatus();
    if (STATE.view === 'mixer') renderMixer();
  }, STATUS_POLL_MS);

  pollSpotify();
  setInterval(pollSpotify, SPOTIFY_POLL_MS);

  // Local progress ticker — one cheap DOM update a second instead of polling
  // the server, and only while Now Playing is on screen.
  setInterval(() => {
    if (STATE.view === 'np' && STATE.spotify.durationMs) renderProgress();
  }, 1000);
}

async function init() {
  // The Car Thing reaches the Pi over a USB (adb reverse) tunnel that may not be
  // up the instant this page loads at boot. Retry until the server answers, so a
  // transient failure is never mistaken for "not set up".
  while (true) {
    try { await fetchConfig(); break; }
    catch (e) {
      showMessage('Connecting to server…');
      await new Promise(res => setTimeout(res, 2000));
    }
  }
  if (!STATE.config.spotify_configured) {
    showMessage('Open http://127.0.0.1:5005/auth on your computer to finish Spotify setup.');
    return;
  }
  startPlayer();
}

init();
</script>
