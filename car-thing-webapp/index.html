<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1, user-scalable=no">
<!-- Don't let the kiosk Chromium serve a stale cached copy after a relaunch. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Volume Presets</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 800px; height: 480px;
    background: #080808;
    color: #ddd;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    cursor: none;
  }
  #app { position: relative; width: 800px; height: 480px; }

  /* NOTE: the Car Thing's webview is an old Chromium that does NOT support
     flexbox `gap` or the `inset` shorthand. Spacing/size use margins + explicit
     dimensions only. */

  /* --- Message view (shown when setup is incomplete) --- */
  #message {
    position: absolute; top: 0; left: 0; width: 800px; height: 480px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080808;
    padding: 40px;
    box-sizing: border-box;
    text-align: center;
  }
  #message #message-text {
    color: #d4a017; font-size: 20px; line-height: 1.6; letter-spacing: 1px;
    max-width: 680px;
  }

  /* shared top bar */
  .header-bar {
    height: 42px; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
  }

  /* --- Mixer view (vertical faders) --- */
  #mixer-view {
    position: absolute; top: 0; left: 0; width: 800px; height: 480px;
    display: flex; flex-direction: column;
  }
  /* SAVE button (top-right) — arms "save current mix to a preset" */
  #save-btn {
    position: absolute; top: 8px; right: 12px; z-index: 5;
    padding: 7px 16px; border-radius: 16px;
    background: #181818; border: 1px solid #444; color: #aaa;
    font-size: 13px; letter-spacing: 2px;
  }
  #save-btn.armed {
    background: rgba(212,160,23,0.18); border-color: #d4a017; color: #f0c040;
  }
  .faders {
    flex: 1; display: flex; flex-direction: row;
    align-items: flex-start; justify-content: space-around;
    padding: 22px 30px 0; box-sizing: border-box;
  }
  .fader {
    display: flex; flex-direction: column; align-items: center;
    width: 150px; padding: 8px; box-sizing: border-box;
    border-radius: 10px;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .fader.focus {
    background: rgba(212, 160, 23, 0.10);
    box-shadow: inset 0 0 0 2px rgba(212, 160, 23, 0.7);
  }
  .fader-pct  { display: block; margin-bottom: 12px; }
  .fader-name { display: block; margin-top: 14px; }
  .fader-track {
    width: 108px; height: 318px;
    background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; overflow: hidden;
  }
  .fader-fill {
    width: 100%; height: 0%;
    background: linear-gradient(to top, #8a6308, #f0c040);
    box-shadow: 0 0 14px rgba(240, 192, 64, 0.45);
    transition: height 0.12s ease-out;
  }
  .fader.focus .fader-fill {
    background: linear-gradient(to top, #c9941a, #ffe49a);
    box-shadow: 0 0 18px rgba(255, 220, 130, 0.6);
  }

  /* --- Now playing view --- */
  #now-playing-view {
    position: absolute; top: 0; left: 0; width: 800px; height: 480px;
    display: none; flex-direction: column;
  }
  .np-body {
    flex: 1; display: flex; flex-direction: row; align-items: center;
    padding: 18px 44px; box-sizing: border-box;
  }
  .np-art {
    width: 268px; height: 268px; flex-shrink: 0; margin-right: 56px;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #1a1a1a; border-radius: 6px; overflow: hidden;
  }
  .np-art img { width: 100%; height: 100%; object-fit: cover; }
  .np-art .placeholder { color: #444; font-size: 10px; letter-spacing: 3px; }
  .np-info {
    flex: 1; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .np-text canvas { display: block; max-width: 100%; }
  #np-track  { margin-bottom: 24px; }
  #np-artist { margin-bottom: 18px; }
  #eq-canvas { display: block; margin-top: 36px; }
  .np-status { display: flex; align-items: center; margin-top: 32px; }
  .led-dot {
    width: 10px; height: 10px; border-radius: 50%; margin-right: 12px;
    background: #ff3030; box-shadow: 0 0 8px #ff3030;
  }
  .led-dot.playing {
    background: #30ff60; box-shadow: 0 0 8px #30ff60;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.25; }
  }

  /* transport controls (bottom of now playing) */
  .np-controls {
    height: 88px; flex-shrink: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    border-top: 1px solid #1a1a1a;
  }
  .np-btn {
    width: 62px; height: 62px; border-radius: 50%;
    background: #181818; border: 1px solid #383838;
    display: flex; align-items: center; justify-content: center;
    margin: 0 28px;
  }
  .np-btn:active { background: #2c2c2c; }
  .np-btn.main { width: 72px; height: 72px; border-color: #d4a017; }
  .np-btn > * + * { margin-left: 4px; }
  .tri-r { width:0; height:0; border-left:20px solid #e6e6e6; border-top:13px solid transparent; border-bottom:13px solid transparent; }
  .tri-l { width:0; height:0; border-right:20px solid #e6e6e6; border-top:13px solid transparent; border-bottom:13px solid transparent; }
  .skip-bar  { width:4px; height:26px; background:#e6e6e6; }
  .pause-bar { width:7px; height:26px; background:#e6e6e6; }

  /* --- Playlists view --- */
  #playlists-view {
    position: absolute; top: 0; left: 0; width: 800px; height: 480px;
    display: none; flex-direction: column;
  }
  #pl-body { flex: 1; position: relative; overflow: hidden; }
  /* explicit edges (the old webview lacks the `inset` shorthand) */
  #pl-list {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: stretch;
    padding: 14px 40px 0; box-sizing: border-box;
  }
  .pl-row {
    height: 54px; flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 16px; box-sizing: border-box; border-radius: 8px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .pl-row.sel {
    background: rgba(212, 160, 23, 0.12);
    box-shadow: inset 0 0 0 2px rgba(212, 160, 23, 0.6);
  }
  .pl-row canvas { display: block; max-width: 100%; }
  #pl-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: none; align-items: center; justify-content: center;
  }
  #pl-overlay canvas { display: block; }
  #pl-hint {
    height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-top: 1px solid #1a1a1a;
  }

  /* shared canvas defaults */
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="app">

  <!-- Message screen (shown when Spotify setup is incomplete) -->
  <div id="message">
    <div id="message-text"></div>
  </div>

  <!-- Mixer view (live vertical faders) -->
  <div id="mixer-view">
    <div id="save-btn">SAVE</div>
    <div class="header-bar"><canvas id="mix-header"></canvas></div>
    <div class="faders" id="faders"></div>
  </div>

  <!-- Now playing view -->
  <div id="now-playing-view">
    <div class="header-bar"><canvas id="np-header-canvas"></canvas></div>
    <div class="np-body">
      <div class="np-art" id="np-art">
        <div class="placeholder">NO ART</div>
      </div>
      <div class="np-info">
        <div class="np-text">
          <canvas id="np-track"></canvas>
          <canvas id="np-artist"></canvas>
          <canvas id="np-album"></canvas>
        </div>
        <canvas id="eq-canvas"></canvas>
        <div class="np-status">
          <div class="led-dot" id="np-led"></div>
          <canvas id="np-state"></canvas>
        </div>
      </div>
    </div>
    <div class="np-controls">
      <div class="np-btn" id="btn-prev"><span class="skip-bar"></span><span class="tri-l"></span></div>
      <div class="np-btn main" id="btn-playpause"></div>
      <div class="np-btn" id="btn-next"><span class="tri-r"></span><span class="skip-bar"></span></div>
    </div>
  </div>

  <!-- Playlists view (dial scrolls, button 1 plays, button 2 refreshes) -->
  <div id="playlists-view">
    <div class="header-bar"><canvas id="pl-header"></canvas></div>
    <div id="pl-body">
      <div id="pl-list"></div>
      <div id="pl-overlay"><canvas id="pl-overlay-canvas"></canvas></div>
    </div>
    <div id="pl-hint"><canvas id="pl-hint-canvas"></canvas></div>
  </div>

</div>

<script>
/* =========================================================
 *  CONFIG
 * ========================================================= */
// The Car Thing has no network of its own — it reaches the Mac server over USB
// via `adb reverse tcp:5005 tcp:5005`, so the server is at the device's own
// localhost. (monitor_watch.sh sets up the reverse tunnel when it starts the
// server.) All internet calls (Spotify) are proxied by the Mac.
const SERVER = 'http://localhost:5005';
const SPOTIFY_POLL_MS = 5000;

// No Spotify credentials or tokens live in (or reach) this webapp. The server
// (server.py) holds the client ID, secret, and refresh token in presets.json,
// and fully proxies Spotify: /spotify/now-playing for the track and
// /spotify/art for album art. Set up Spotify once on the Mac at
// http://127.0.0.1:5005/auth.

/* =========================================================
 *  5x7 DOT MATRIX FONT (do not modify)
 * ========================================================= */
var F={
'A':['01110','10001','10001','11111','10001','10001','10001'],
'B':['11110','10001','10001','11110','10001','10001','11110'],
'C':['01110','10001','10000','10000','10000','10001','01110'],
'D':['11110','10001','10001','10001','10001','10001','11110'],
'E':['11111','10000','10000','11110','10000','10000','11111'],
'F':['11111','10000','10000','11110','10000','10000','10000'],
'G':['01110','10001','10000','10111','10001','10001','01110'],
'H':['10001','10001','10001','11111','10001','10001','10001'],
'I':['01110','00100','00100','00100','00100','00100','01110'],
'J':['00111','00010','00010','00010','00010','10010','01100'],
'K':['10001','10010','10100','11000','10100','10010','10001'],
'L':['10000','10000','10000','10000','10000','10000','11111'],
'M':['10001','11011','10101','10101','10001','10001','10001'],
'N':['10001','10001','11001','10101','10011','10001','10001'],
'O':['01110','10001','10001','10001','10001','10001','01110'],
'P':['11110','10001','10001','11110','10000','10000','10000'],
'Q':['01110','10001','10001','10001','10101','10010','01101'],
'R':['11110','10001','10001','11110','10100','10010','10001'],
'S':['01110','10001','10000','01110','00001','10001','01110'],
'T':['11111','00100','00100','00100','00100','00100','00100'],
'U':['10001','10001','10001','10001','10001','10001','01110'],
'V':['10001','10001','10001','10001','01010','01010','00100'],
'W':['10001','10001','10001','10101','10101','10101','01010'],
'X':['10001','10001','01010','00100','01010','10001','10001'],
'Y':['10001','10001','01010','00100','00100','00100','00100'],
'Z':['11111','00001','00010','00100','01000','10000','11111'],
'a':['00000','00000','01110','00001','01111','10001','01111'],
'b':['10000','10000','10110','11001','10001','10001','11110'],
'c':['00000','00000','01110','10000','10000','10001','01110'],
'd':['00001','00001','01101','10011','10001','10001','01111'],
'e':['00000','00000','01110','10001','11111','10000','01110'],
'f':['00110','01001','01000','11100','01000','01000','01000'],
'g':['00000','00000','01111','10001','01111','00001','01110'],
'h':['10000','10000','10110','11001','10001','10001','10001'],
'i':['00100','00000','01100','00100','00100','00100','01110'],
'j':['00010','00000','00110','00010','00010','10010','01100'],
'k':['10000','10000','10010','10100','11000','10100','10010'],
'l':['01100','00100','00100','00100','00100','00100','01110'],
'm':['00000','00000','11010','10101','10101','10001','10001'],
'n':['00000','00000','10110','11001','10001','10001','10001'],
'o':['00000','00000','01110','10001','10001','10001','01110'],
'p':['00000','00000','11110','10001','11110','10000','10000'],
'q':['00000','00000','01101','10011','01111','00001','00001'],
'r':['00000','00000','10110','11001','10000','10000','10000'],
's':['00000','00000','01110','10000','01110','00001','11110'],
't':['01000','01000','11100','01000','01000','01001','00110'],
'u':['00000','00000','10001','10001','10001','10011','01101'],
'v':['00000','00000','10001','10001','10001','01010','00100'],
'w':['00000','00000','10001','10001','10101','10101','01010'],
'x':['00000','00000','10001','01010','00100','01010','10001'],
'y':['00000','00000','10001','10001','01111','00001','01110'],
'z':['00000','00000','11111','00010','00100','01000','11111'],
'0':['01110','10001','10011','10101','11001','10001','01110'],
'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','00100','01000','11111'],
'3':['01110','10001','00001','00110','00001','10001','01110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],
'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['00110','01000','10000','11110','10001','10001','01110'],
'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],
'9':['01110','10001','10001','01111','00001','00010','01100'],
' ':['00000','00000','00000','00000','00000','00000','00000'],
'.':['00000','00000','00000','00000','00000','00000','00100'],
',':['00000','00000','00000','00000','00000','00100','01000'],
'!':['00100','00100','00100','00100','00100','00000','00100'],
'?':['01110','10001','00001','00110','00100','00000','00100'],
'-':['00000','00000','00000','11111','00000','00000','00000'],
"'":['00100','00100','01000','00000','00000','00000','00000'],
':':['00000','00100','00000','00000','00000','00100','00000'],
'/':['00001','00010','00010','00100','01000','01000','10000'],
};

function renderDotText(canvasEl, text, dotSz, gap, color, glow, bright) {
  var cW=5,cH=7,sp=1;
  var totalW=text.length*(cW+sp)-sp;
  if(totalW<=0)return;
  var pW=totalW*(dotSz+gap)-gap, pH=cH*(dotSz+gap)-gap;
  if(pW<=0||pH<=0)return;
  pW=Math.min(4000,pW);
  canvasEl.width=pW; canvasEl.height=pH;
  canvasEl.style.width=pW+'px'; canvasEl.style.height=pH+'px';
  var ctx=canvasEl.getContext('2d');
  ctx.clearRect(0,0,pW,pH);
  var offX=0;
  for(var ci=0;ci<text.length;ci++){
    var ch=text[ci], gl=F[ch]||F[' '];
    for(var row=0;row<cH;row++){
      if(!gl[row])continue;
      for(var col=0;col<cW;col++){
        var px=offX+col*(dotSz+gap), py=row*(dotSz+gap);
        if(px>pW)break;
        if(gl[row][col]==='1'){
          if(glow>0){ctx.shadowColor='rgba('+color+','+glow+')';ctx.shadowBlur=dotSz*2.5;}
          ctx.fillStyle='rgba('+color+','+bright+')';
          ctx.beginPath();ctx.arc(px+dotSz/2,py+dotSz/2,dotSz/2,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;
        } else {
          ctx.fillStyle='rgba(255,255,255,0.04)';
          ctx.beginPath();ctx.arc(px+dotSz/2,py+dotSz/2,dotSz/2,0,Math.PI*2);ctx.fill();
        }
      }
    }
    offX+=(cW+sp)*(dotSz+gap);
  }
}

/* Normalize text into the font's supported character set. */
function sanitizeText(s) {
  if (!s) return '';
  s = s.toString();
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (F[ch]) out += ch;
    else if (ch === '\n' || ch === '\t') out += ' ';
    else out += ' ';
  }
  return out;
}

/* =========================================================
 *  STATE
 * ========================================================= */
const STATE = {
  config: null,           // /presets payload
  activePreset: null,
  view: 'np',             // 'mixer' | 'np' — Now Playing is the home screen
  volumes: {},            // live per-speaker volumes (0..1)
  focus: null,            // speaker key the dial controls, or null = ALL
  spotify: {
    track: null,
    artist: null,
    album: null,
    artUrl: null,
    playing: false,
  },
};
const SPEAKER_ORDER = ['nest_audio', 'google_home', 'chromecast'];
const VOL_STEP = 0.05;    // per dial detent / arrow key
const NP_RETURN_MS = 12000; // idle delay before the mixer reverts to Now Playing
const SAVE_ARM_MS = 6000;   // how long "save" stays armed waiting for a preset
let focusTimer = null;
let npReturnTimer = null;
let mixerBuilt = false;
let saveArmed = false;      // when true, pressing 1/2/3 SAVES instead of activates
let saveArmTimer = null;
let savedFlash = '';        // transient "SAVED -> NAME" header message
let savedFlashTimer = null;

/* Now Playing is home: after the mixer is idle for a bit, return to it. */
function scheduleReturnToNowPlaying() {
  if (npReturnTimer) clearTimeout(npReturnTimer);
  npReturnTimer = setTimeout(() => {
    npReturnTimer = null;
    if (STATE.view !== 'np') { STATE.view = 'np'; applyView(); }
  }, NP_RETURN_MS);
}
function cancelReturnToNowPlaying() {
  if (npReturnTimer) { clearTimeout(npReturnTimer); npReturnTimer = null; }
}

/* =========================================================
 *  PLAYLISTS SCREEN
 *  Opened with the back button (see input handlers). The dial scrolls the
 *  selection, button 1 plays the selected playlist on the Spotify Connect
 *  device (server reads the target from presets.json), button 2 re-fetches.
 *  Same dot-matrix canvas rendering as the rest of the UI — text only.
 * ========================================================= */
const PL_VISIBLE_ROWS = 6;        // rows drawn at once (list scrolls within)
const playlistState = {
  items: [],            // [{id, name, image_url}] from /spotify/playlists
  selected: 0,          // index into items
  scrollTop: 0,         // first visible item index
  loading: false,
  loaded: false,        // cached for the session once fetched
  error: false,
  flash: '',            // transient overlay: 'PLAYING' | 'ERROR' | ''
};
let plRowsBuilt = false;
let plRowEls = [];
let playlistFlashTimer = null;

/* Open the Playlists screen (from Mixer / Now Playing). Fetches on first open
   only; cached thereafter until an explicit refresh (button 2). */
function openPlaylists() {
  cancelReturnToNowPlaying();      // don't let the idle timer pull us to NP
  STATE.view = 'playlists';
  applyView();                     // renders (possibly the loading overlay)
  loadPlaylists(false);            // no-op fetch if already cached
}

/* Back button: Playlists -> Mixer, or Mixer/NowPlaying -> Playlists. */
function handleBack() {
  if (STATE.view === 'playlists') {
    STATE.view = 'mixer';
    applyView();
    scheduleReturnToNowPlaying();
  } else {
    openPlaylists();
  }
}

async function loadPlaylists(force) {
  if (playlistState.loading) return;
  if (playlistState.loaded && !force) { renderPlaylists(); return; }
  playlistState.loading = true;
  playlistState.error = false;
  if (STATE.view === 'playlists') renderPlaylists();   // show LOADING
  try {
    const r = await fetch(SERVER + '/spotify/playlists', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    playlistState.items = Array.isArray(arr) ? arr : [];
    playlistState.selected = 0;
    playlistState.scrollTop = 0;
    playlistState.loaded = true;
    playlistState.error = false;
  } catch (e) {
    console.error('playlists fetch error', e);
    playlistState.error = true;
  } finally {
    playlistState.loading = false;
    if (STATE.view === 'playlists') renderPlaylists();
  }
}

function movePlaylistSelection(dir) {
  const n = playlistState.items.length;
  if (!n) return;
  playlistState.selected = Math.max(0, Math.min(n - 1, playlistState.selected + dir));
  // Keep the selection inside the visible window.
  if (playlistState.selected < playlistState.scrollTop) {
    playlistState.scrollTop = playlistState.selected;
  } else if (playlistState.selected >= playlistState.scrollTop + PL_VISIBLE_ROWS) {
    playlistState.scrollTop = playlistState.selected - PL_VISIBLE_ROWS + 1;
  }
  renderPlaylists();
}

function showPlaylistFlash(text) {
  playlistState.flash = text;
  if (playlistFlashTimer) { clearTimeout(playlistFlashTimer); playlistFlashTimer = null; }
  renderPlaylists();
}

async function playSelectedPlaylist() {
  const it = playlistState.items[playlistState.selected];
  if (!it || !it.id) return;
  showPlaylistFlash('PLAYING');           // immediate confirmation
  let ok = false;
  try {
    // device_name is intentionally omitted — the server uses
    // spotify_connect_device from presets.json (kept off the device).
    const r = await fetch(SERVER + '/spotify/play-playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playlist_uri: it.id }),
    });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && j && j.ok === true;
  } catch (e) {
    console.error('play-playlist error', e);
    ok = false;
  }
  if (playlistFlashTimer) clearTimeout(playlistFlashTimer);
  if (ok) {
    // Hold "PLAYING..." ~2s, then drop back to the mixer (Now Playing follows).
    playlistFlashTimer = setTimeout(() => {
      playlistState.flash = '';
      STATE.view = 'mixer';
      applyView();
      scheduleReturnToNowPlaying();
      pollSpotify();
    }, 2000);
  } else {
    // Show "ERROR" ~2s, then stay on the Playlists screen.
    showPlaylistFlash('ERROR');
    playlistFlashTimer = setTimeout(() => { playlistState.flash = ''; renderPlaylists(); }, 2000);
  }
}

/* Build the fixed pool of visible row elements once; renders just update them. */
function buildPlaylistRows() {
  if (plRowsBuilt) return;
  const list = document.getElementById('pl-list');
  list.innerHTML = '';
  plRowEls = [];
  for (let i = 0; i < PL_VISIBLE_ROWS; i++) {
    const row = document.createElement('div');
    row.className = 'pl-row';
    const cv = document.createElement('canvas');
    row.appendChild(cv);
    // Tap a visible row to select it (parity with the mixer's tap-to-focus).
    row.addEventListener('click', (function (slot) {
      return function () {
        const idx = playlistState.scrollTop + slot;
        if (idx < playlistState.items.length) {
          playlistState.selected = idx;
          renderPlaylists();
        }
      };
    })(i));
    list.appendChild(row);
    plRowEls.push({ row: row, cv: cv });
  }
  plRowsBuilt = true;
}

function renderPlaylists() {
  buildPlaylistRows();
  renderDotTextFit(document.getElementById('pl-header'), 'PLAYLISTS', 280, 4, '180,180,180', 4, 0.6);
  renderDotTextFit(document.getElementById('pl-hint-canvas'),
    '1 PLAY  2 REFRESH  BACK EXIT', 560, 2.4, '120,120,120', 1, 0.6);

  const ps = playlistState;
  const overlay = document.getElementById('pl-overlay');
  const list = document.getElementById('pl-list');

  // Overlay (loading / error / empty / play feedback) takes over the list area.
  let overlayText = '';
  let overlayColor = '180,180,180';
  if (ps.flash === 'PLAYING')      { overlayText = 'PLAYING...'; overlayColor = '60,220,90'; }
  else if (ps.flash === 'ERROR')   { overlayText = 'ERROR';      overlayColor = '220,80,80'; }
  else if (ps.loading)             { overlayText = 'LOADING...'; overlayColor = '180,180,180'; }
  else if (ps.error)               { overlayText = 'ERROR  PRESS 2 TO RETRY'; overlayColor = '220,80,80'; }
  else if (!ps.items.length)       { overlayText = 'NO PLAYLISTS'; overlayColor = '150,150,150'; }

  if (overlayText) {
    list.style.display = 'none';
    overlay.style.display = 'flex';
    renderDotTextFit(document.getElementById('pl-overlay-canvas'), overlayText, 560, 7, overlayColor, 5, 0.9);
    return;
  }
  overlay.style.display = 'none';
  list.style.display = 'flex';

  for (let i = 0; i < PL_VISIBLE_ROWS; i++) {
    const idx = ps.scrollTop + i;
    const slot = plRowEls[i];
    if (idx >= ps.items.length) {
      slot.row.style.visibility = 'hidden';
      slot.row.classList.remove('sel');
      continue;
    }
    slot.row.style.visibility = 'visible';
    const it = ps.items[idx];
    const selected = idx === ps.selected;
    slot.row.classList.toggle('sel', selected);
    const label = (selected ? '> ' : '  ') + (it.name || 'UNTITLED');
    const color = selected ? '255,224,154' : '170,170,170';
    renderDotTextFit(slot.cv, label, 680, selected ? 5 : 4.2, color, selected ? 6 : 2, selected ? 0.95 : 0.7);
  }
}

/* =========================================================
 *  CONFIG FETCH
 * ========================================================= */
async function fetchConfig() {
  // Throws on failure so init() can retry — at boot the USB tunnel may not be
  // up yet, and we must not mistake "server unreachable" for "not configured".
  const r = await fetch(SERVER + '/presets', { cache: 'no-store' });
  if (!r.ok) throw new Error('presets HTTP ' + r.status);
  STATE.config = await r.json();
}

async function fetchStatus() {
  try {
    const r = await fetch(SERVER + '/status', { cache: 'no-store' });
    const j = await r.json();
    STATE.activePreset = j.active_preset;
    if (j.volumes) STATE.volumes = j.volumes;
  } catch (e) {}
}

/* =========================================================
 *  MIXER VIEW (live vertical faders)
 * ========================================================= */
const SPEAKER_LABELS = { nest_audio: 'NEST', google_home: 'HOME', chromecast: 'CAST' };

/* Render dot-matrix text scaled to fit within maxW px (prevents overflow). */
function renderDotTextFit(cv, text, maxW, maxDot, color, glow, bright) {
  text = sanitizeText(text);
  const n = Math.max(1, text.length);
  const gapRatio = 0.25;
  let dot = maxW / (n * 6 * (1 + gapRatio));
  dot = Math.max(1, Math.min(maxDot, dot));
  renderDotText(cv, text, dot, dot * gapRatio, color, glow, bright);
}

/* Build the three fader elements once; later calls just update them. */
function buildFaders() {
  if (mixerBuilt) return;
  const wrap = document.getElementById('faders');
  wrap.innerHTML = '';
  for (const sp of SPEAKER_ORDER) {
    const fader = document.createElement('div');
    fader.className = 'fader';
    fader.dataset.sp = sp;
    const pct = document.createElement('canvas'); pct.className = 'fader-pct';
    const track = document.createElement('div'); track.className = 'fader-track';
    const fill = document.createElement('div'); fill.className = 'fader-fill';
    const name = document.createElement('canvas'); name.className = 'fader-name';
    track.appendChild(fill);
    fader.appendChild(pct); fader.appendChild(track); fader.appendChild(name);
    fader.addEventListener('click', () => focusDevice(sp));
    wrap.appendChild(fader);
  }
  mixerBuilt = true;
}

function renderMixer() {
  buildFaders();

  // Header reflects save-mode / what the dial currently controls.
  const presets = (STATE.config && STATE.config.presets) || {};
  const ap = STATE.activePreset && presets[STATE.activePreset];
  let title, color, glow, bright;
  if (savedFlash) {
    title = savedFlash;
    color = '60,220,90'; glow = 7; bright = 0.95;
  } else if (saveArmed) {
    title = 'SAVE TO 1 2 3';
    color = '212,160,23'; glow = 7; bright = 0.95;
  } else if (STATE.focus) {
    title = (SPEAKER_LABELS[STATE.focus] || 'DEVICE') + ' VOL';
    color = '212,160,23'; glow = 7; bright = 0.95;
  } else if (ap) {
    title = sanitizeText(ap.name);
    color = '212,160,23'; glow = 6; bright = 0.9;
  } else {
    title = 'VOLUME';
    color = '180,180,180'; glow = 4; bright = 0.7;
  }
  renderDotTextFit(document.getElementById('mix-header'), title, 420, 5, color, glow, bright);
  const sb = document.getElementById('save-btn');
  if (sb) sb.classList.toggle('armed', saveArmed);

  // Faders
  document.querySelectorAll('#faders .fader').forEach((fader) => {
    const sp = fader.dataset.sp;
    const v = Math.max(0, Math.min(1, STATE.volumes[sp] || 0));
    const focused = STATE.focus === sp;
    fader.classList.toggle('focus', focused);
    fader.querySelector('.fader-fill').style.height = (v * 100) + '%';
    const c = focused ? '255,224,154' : '230,200,120';
    renderDotTextFit(fader.querySelector('.fader-pct'), String(Math.round(v * 100)), 84, 5, c, focused ? 6 : 3, 0.95);
    renderDotTextFit(fader.querySelector('.fader-name'), SPEAKER_LABELS[sp] || sp, 110, 3, '160,160,160', 2, 0.65);
  });
}

function focusDevice(sp) {
  STATE.focus = sp;
  armFocusTimeout();
  scheduleReturnToNowPlaying();
  renderMixer();
}

/* Auto-return to ALL a few seconds after the last individual interaction. */
function armFocusTimeout() {
  if (focusTimer) clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { STATE.focus = null; renderMixer(); }, 4000);
}

/* =========================================================
 *  ACTIONS
 * ========================================================= */
async function activatePreset(id) {
  STATE.focus = null;
  if (focusTimer) clearTimeout(focusTimer);
  try {
    const r = await fetch(SERVER + '/preset/' + id, { method: 'POST' });
    const j = await r.json();
    if (j && j.ok) {
      STATE.activePreset = id;
      if (j.volumes) STATE.volumes = j.volumes;
      if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
      else renderMixer();
      scheduleReturnToNowPlaying();
    } else {
      console.error('preset activation failed', j);
    }
  } catch (e) {
    console.error('preset activation error', e);
  }
}

/* --- Save current mix to a preset ------------------------------------- */
function armSave() {
  saveArmed = !saveArmed;          // tapping SAVE toggles
  if (saveArmTimer) clearTimeout(saveArmTimer);
  if (saveArmed) {
    saveArmTimer = setTimeout(() => { saveArmed = false; renderMixer(); }, SAVE_ARM_MS);
    scheduleReturnToNowPlaying();
  }
  renderMixer();
}

async function savePreset(id) {
  saveArmed = false;
  if (saveArmTimer) clearTimeout(saveArmTimer);
  try {
    const r = await fetch(SERVER + '/preset/' + id + '/save', { method: 'POST' });
    const j = await r.json();
    if (j && j.ok) {
      STATE.activePreset = id;
      if (STATE.config && STATE.config.presets && STATE.config.presets[id] && j.levels) {
        Object.assign(STATE.config.presets[id], j.levels);  // keep local config in sync
      }
      savedFlash = 'SAVED ' + (j.preset || '');
      if (savedFlashTimer) clearTimeout(savedFlashTimer);
      savedFlashTimer = setTimeout(() => { savedFlash = ''; renderMixer(); }, 1800);
      scheduleReturnToNowPlaying();
    }
  } catch (e) { console.error('save preset error', e); }
  renderMixer();
}

async function adjustVolume(delta) {
  const body = { delta };
  if (STATE.focus) { body.speaker = STATE.focus; armFocusTimeout(); }
  // Turning the dial shows the mixer so you can see it move; it reverts to Now
  // Playing after a short idle.
  if (STATE.view !== 'mixer') { STATE.view = 'mixer'; applyView(); }
  scheduleReturnToNowPlaying();
  try {
    const r = await fetch(SERVER + '/volume/adjust', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (j && j.volumes) { STATE.volumes = j.volumes; renderMixer(); }
  } catch (e) {
    console.error('volume adjust error', e);
  }
}

function toggleView() {
  STATE.view = (STATE.view === 'mixer') ? 'np' : 'mixer';
  applyView();
  if (STATE.view === 'mixer') scheduleReturnToNowPlaying();
  else cancelReturnToNowPlaying();
}

function applyView() {
  const v = STATE.view;
  document.getElementById('mixer-view').style.display = (v === 'mixer') ? 'flex' : 'none';
  document.getElementById('now-playing-view').style.display = (v === 'np') ? 'flex' : 'none';
  document.getElementById('playlists-view').style.display = (v === 'playlists') ? 'flex' : 'none';
  document.getElementById('message').style.display = 'none';
  if (v === 'np') {
    renderNowPlaying();
    startEQ();
  } else if (v === 'playlists') {
    stopEQ();
    renderPlaylists();
  } else {
    stopEQ();
    renderMixer();
  }
}

/* =========================================================
 *  SPOTIFY NOW PLAYING (fully proxied by the Mac at
 *  /spotify/now-playing — no tokens or internet on the device)
 * ========================================================= */
async function pollSpotify() {
  try {
    const r = await fetch(SERVER + '/spotify/now-playing', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();      // {item, is_playing} — item may be null
    handleNowPlaying(j);
  } catch (e) { console.error('spotify poll error', e); }
}

/* Transport controls — proxied by the Mac (needs Premium + the
   user-modify-playback-state scope). */
async function spotifyControl(action) {
  try { await fetch(SERVER + '/spotify/' + action, { method: 'POST' }); }
  catch (e) { console.error('spotify control error', e); }
  // Re-poll soon so the screen reflects the new state.
  setTimeout(pollSpotify, 350);
  setTimeout(pollSpotify, 1200);
}

function handleNowPlaying(j) {
  const s = STATE.spotify;
  if (!j || !j.item) {
    s.playing = false;
    s.track = null; s.artist = null; s.album = null; s.artUrl = null;
  } else {
    s.playing = !!j.is_playing;
    s.track = j.item.name || '';
    s.artist = (j.item.artists || []).map(a => a.name).join(', ');
    s.album = (j.item.album && j.item.album.name) || '';
    const imgs = (j.item.album && j.item.album.images) || [];
    // Album art lives on the Spotify CDN, which the device can't reach — proxy
    // it through the Mac.
    s.artUrl = imgs.length ? (SERVER + '/spotify/art?u=' + encodeURIComponent(imgs[0].url)) : null;
  }
  // Now Playing is the home screen; the mixer is only shown transiently while
  // adjusting volume and reverts on its own. So we don't switch views here.
  if (STATE.view === 'np') renderNowPlaying();
}

/* =========================================================
 *  NOW PLAYING RENDER
 * ========================================================= */
function renderNowPlaying() {
  const s = STATE.spotify;
  renderDotTextFit(document.getElementById('np-header-canvas'), 'NOW PLAYING', 200, 4, '180,180,180', 4, 0.55);

  const artDiv = document.getElementById('np-art');
  if (s.artUrl) {
    artDiv.innerHTML = '<img src="' + s.artUrl + '" alt="art">';
  } else {
    artDiv.innerHTML = '<div class="placeholder">NO ART</div>';
  }

  // The info column is ~380px wide; fit text to it so nothing overflows.
  const INFO_W = 376;
  renderDotTextFit(document.getElementById('np-track'), s.track || 'NO TRACK', INFO_W, 5.5, '235,235,235', 3, 0.95);
  renderDotTextFit(document.getElementById('np-artist'), s.artist || '', INFO_W, 3.6, '190,190,190', 2, 0.7);
  renderDotTextFit(document.getElementById('np-album'), s.album || '', INFO_W, 2.8, '150,150,150', 1, 0.55);

  const led = document.getElementById('np-led');
  led.classList.toggle('playing', !!s.playing);
  renderDotTextFit(document.getElementById('np-state'), s.playing ? 'PLAYING' : 'PAUSED', 110, 2.8, s.playing ? '60,220,90' : '220,80,80', 4, 0.8);

  // Play/pause button icon reflects playback state.
  const pp = document.getElementById('btn-playpause');
  if (pp) {
    pp.innerHTML = s.playing
      ? '<span class="pause-bar"></span><span class="pause-bar"></span>'
      : '<span class="tri-r"></span>';
  }
}

/* =========================================================
 *  EQ VISUALIZER (rainbow bars)
 * ========================================================= */
var EC=14, ER=5, DOT=7, GAP=3;
var eqColors=[];
(function(){
  var cs=[[0,210,180],[0,220,100],[180,220,0],[255,180,0],[255,60,60],[220,40,180]];
  for(var j=0;j<ER;j++){
    var p=j/(ER-1), idx=p*(cs.length-1), lo=Math.floor(idx), hi=Math.min(lo+1,cs.length-1), f=idx-lo;
    eqColors.push('rgb('+Math.round(cs[lo][0]+(cs[hi][0]-cs[lo][0])*f)+','+Math.round(cs[lo][1]+(cs[hi][1]-cs[lo][1])*f)+','+Math.round(cs[lo][2]+(cs[hi][2]-cs[lo][2])*f)+')');
  }
})();
var eqState = { running: false, raf: 0, levels: new Array(EC).fill(0), targets: new Array(EC).fill(0), lastTarget: 0 };

function drawEQ() {
  const cv = document.getElementById('eq-canvas');
  const w = EC*(DOT+GAP)-GAP;
  const h = ER*(DOT+GAP)-GAP;
  cv.width = w; cv.height = h;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  // update targets occasionally
  const now = performance.now();
  if (now - eqState.lastTarget > 110) {
    eqState.lastTarget = now;
    const active = STATE.spotify.playing;
    for (let i = 0; i < EC; i++) {
      if (active) {
        const bias = 0.5 + 0.5 * Math.sin((now/600) + i*0.7);
        eqState.targets[i] = Math.min(ER, Math.max(0, Math.round(bias * ER * (0.6 + Math.random()*0.8))));
      } else {
        eqState.targets[i] = 0;
      }
    }
  }
  // ease levels toward targets
  for (let i = 0; i < EC; i++) {
    const t = eqState.targets[i];
    const cur = eqState.levels[i];
    eqState.levels[i] = cur + (t - cur) * 0.25;
  }
  // draw dots
  for (let c = 0; c < EC; c++) {
    const lv = eqState.levels[c];
    for (let r = 0; r < ER; r++) {
      const rowFromTop = r;
      const rowFromBottom = ER - 1 - r;
      const px = c*(DOT+GAP);
      const py = r*(DOT+GAP);
      const on = (rowFromBottom + 1) <= lv;
      ctx.beginPath();
      if (on) {
        ctx.fillStyle = eqColors[rowFromBottom];
        ctx.shadowColor = eqColors[rowFromBottom];
        ctx.shadowBlur = DOT;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.shadowBlur = 0;
      }
      ctx.arc(px+DOT/2, py+DOT/2, DOT/2, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

function eqLoop() {
  if (!eqState.running) return;
  drawEQ();
  eqState.raf = requestAnimationFrame(eqLoop);
}

function startEQ() {
  if (eqState.running) return;
  eqState.running = true;
  eqLoop();
}

function stopEQ() {
  eqState.running = false;
  if (eqState.raf) cancelAnimationFrame(eqState.raf);
}

/* =========================================================
 *  INPUT (keyboard + hardware websocket)
 * ========================================================= */
/* Route a scroll detent: scrolls the playlist on the Playlists screen, adjusts
   volume everywhere else (unchanged mixer/now-playing behavior). */
function handleScroll(dir) {
  if (STATE.view === 'playlists') movePlaylistSelection(dir > 0 ? +1 : -1);
  else adjustVolume(dir > 0 ? +VOL_STEP : -VOL_STEP);
}

function bindKeyboard() {
  window.addEventListener('keydown', (e) => {
    // Back button (5th button) — keyboard fallback for desktop testing. Toggles
    // the Playlists screen. Handled first so it works from any view.
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      handleBack();
      return;
    }
    // Playlists screen repurposes 1/2 and the arrows; it never touches the
    // mixer/now-playing key behavior below.
    if (STATE.view === 'playlists') {
      if (e.key === '1')              playSelectedPlaylist();
      else if (e.key === '2')         loadPlaylists(true);     // refresh
      else if (e.key === 'ArrowUp')   movePlaylistSelection(-1);
      else if (e.key === 'ArrowDown') movePlaylistSelection(+1);
      return;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      if (saveArmed) savePreset(e.key);   // SAVE armed → store current mix here
      else activatePreset(e.key);
    }
    else if (e.key === '4') { toggleView(); }
    else if (e.key === 'ArrowUp')   { adjustVolume(+VOL_STEP); }
    else if (e.key === 'ArrowDown') { adjustVolume(-VOL_STEP); }
  });

  // The Car Thing's rotary dial is a relative wheel encoder (REL_HWHEEL): it has
  // no keyboard handler and isn't on the hardware websocket, so the webview
  // delivers it as a DOM `wheel` event. Use whichever axis is non-zero; one
  // detent → one volume step (clockwise = louder) — or one playlist row on the
  // Playlists screen.
  window.addEventListener('wheel', (e) => {
    const d = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (d > 0) handleScroll(+1);
    else if (d < 0) handleScroll(-1);
  }, { passive: true });

  // SAVE button: arm "save current mix to a preset" (then press 1/2/3).
  document.getElementById('save-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    armSave();
  });

  // Tapping anywhere on the mixer that isn't a fader deselects the focused
  // device, so the dial goes back to controlling all speakers together.
  document.getElementById('mixer-view').addEventListener('click', (e) => {
    if (e.target.closest('.fader') || e.target.closest('#save-btn')) return;
    if (STATE.focus) {
      STATE.focus = null;
      if (focusTimer) clearTimeout(focusTimer);
      renderMixer();
    }
    scheduleReturnToNowPlaying();
  });

  // Now Playing transport controls (touch).
  document.getElementById('btn-prev').addEventListener('click', () => spotifyControl('previous'));
  document.getElementById('btn-next').addEventListener('click', () => spotifyControl('next'));
  document.getElementById('btn-playpause').addEventListener('click', () => {
    const action = STATE.spotify.playing ? 'pause' : 'play';
    STATE.spotify.playing = !STATE.spotify.playing;  // optimistic
    renderNowPlaying();
    spotifyControl(action);
  });
}

function connectHardwareWS() {
  let ws;
  try {
    ws = new WebSocket('ws://localhost:8890');
  } catch (e) { return; }
  ws.onopen = () => console.log('hw ws open');
  ws.onclose = () => setTimeout(connectHardwareWS, 3000);
  ws.onerror = () => {};
  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    // common shapes: {type:'button', button:1|2|3|4, action:'down'|'up'} or {type:'dial', delta:+1|-1}
    // The Car Thing's back button arrives either as its own {type:'back'} or as
    // a 5th button id ({type:'button', button:5}). If yours uses a different id,
    // change the b === '5' check below (find it with `udevadm`/WS logging).
    if (msg.type === 'back') { handleBack(); return; }
    if (msg.type === 'button' && (msg.action === 'down' || msg.action === 'short' || !msg.action)) {
      const b = String(msg.button);
      if (b === '5') { handleBack(); return; }   // 5th / back button → Playlists
      if (STATE.view === 'playlists') {
        if (b === '1') playSelectedPlaylist();
        else if (b === '2') loadPlaylists(true); // refresh
        return;
      }
      if (b === '1' || b === '2' || b === '3') activatePreset(b);
      else if (b === '4') toggleView();
    } else if (msg.type === 'dial') {
      const delta = Number(msg.delta) || 0;
      if (delta > 0) handleScroll(+1);
      else if (delta < 0) handleScroll(-1);
    } else if (msg.type === 'wheel') {
      const delta = Number(msg.delta) || 0;
      if (delta > 0) handleScroll(+1);
      else if (delta < 0) handleScroll(-1);
    }
  };
}

/* =========================================================
 *  MESSAGE SCREEN
 * ========================================================= */
function showMessage(text) {
  document.getElementById('mixer-view').style.display = 'none';
  document.getElementById('now-playing-view').style.display = 'none';
  document.getElementById('playlists-view').style.display = 'none';
  const msg = document.getElementById('message');
  msg.style.display = 'flex';
  document.getElementById('message-text').textContent = text;
}

/* =========================================================
 *  PLAYER START
 * ========================================================= */
async function startPlayer() {
  await fetchStatus();
  applyView();          // renders the mixer
  bindKeyboard();
  connectHardwareWS();

  // periodic refresh — keep faders in sync if volumes change elsewhere
  setInterval(async () => {
    await fetchStatus();
    if (STATE.view === 'mixer') renderMixer();
  }, 4000);

  // poll spotify
  pollSpotify();
  setInterval(pollSpotify, SPOTIFY_POLL_MS);
}

/* =========================================================
 *  INIT
 * ========================================================= */
async function init() {
  // The Car Thing reaches the Mac over a USB (adb reverse) tunnel that may not
  // be up the instant this page loads at boot. Retry until the server answers,
  // so a transient connection failure never gets mistaken for "not set up".
  while (true) {
    try {
      await fetchConfig();
      break;
    } catch (e) {
      showMessage('Connecting to Mac server…');
      await new Promise(res => setTimeout(res, 2000));
    }
  }
  // The server reports whether Spotify has been set up (client secret + refresh
  // token present in presets.json). If not, point the user at the Mac auth page.
  if (!STATE.config.spotify_configured) {
    showMessage('Open http://127.0.0.1:5005/auth on your Mac to complete setup.');
    return;
  }
  startPlayer();
}

init();
</script>
